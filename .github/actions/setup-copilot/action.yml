name: "Setup Copilot"
description: "Setup Copilot based on the project's package.json file."
outputs:
  cli-path:
    description: "Path to the Copilot CLI"
    value: ${{ steps.cli-path.outputs.path }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v6
      if: runner.os != 'Windows'
      with:
        cache: "npm"
        cache-dependency-path: "./nodejs/package-lock.json"
        node-version: 22
    - uses: actions/setup-node@v6
      if: runner.os == 'Windows'
      with:
        node-version: 22
    - name: Install dependencies
      run: npm --prefix "$(pwd)/nodejs" ci --ignore-scripts
      shell: bash
    - name: Set CLI path
      id: cli-path
      run: |
        cli_path=$(npm --prefix "$(pwd)/nodejs" run --silent prepare:runtime -- --print-path)
        if [ -z "$cli_path" ]; then
          echo "Could not prepare the Copilot CLI runtime" >&2
          exit 1
        fi
        echo "path=$cli_path" >> $GITHUB_OUTPUT
      shell: bash
    - name: Verify CLI works
      run: |
        legacy_cli=$(npm --prefix "$(pwd)/nodejs" run --silent prepare:runtime -- --print-legacy-path)
        node "$legacy_cli" --version
      shell: bash
