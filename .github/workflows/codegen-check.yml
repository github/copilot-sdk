name: "Codegen Check"

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/codegen/**'
      - 'nodejs/src/generated/**'
      - 'dotnet/src/Generated/**'
      - 'python/copilot/generated/**'
      - 'go/generated_*.go'
      - 'go/rpc/**'
      - 'rust/src/generated/**'
      - 'sdk-protocol-version.json'
      - 'java/sdk/src/main/java/com/github/copilot/SdkProtocolVersion.java'
      - '.github/workflows/codegen-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: "Verify generated files are up-to-date"
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'

      # Rust generator runs `cargo fmt` on the output, so we need a toolchain with rustfmt.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.94.0"
          components: rustfmt

      # Nightly rustfmt for unstable format options (group_imports,
      # imports_granularity, reorder_impl_items) — pinned in
      # `rust/.rustfmt.nightly.toml`. The Rust generator emits unconsolidated
      # imports under stable rustfmt; nightly fmt consolidates them to match
      # the canonical committed form.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # master
        with:
          toolchain: nightly-2026-04-14
          components: rustfmt

      - name: Install nodejs SDK dependencies
        working-directory: ./nodejs
        run: npm ci

      - name: Install codegen dependencies
        working-directory: ./scripts/codegen
        run: npm ci

      - name: Run codegen
        working-directory: ./scripts/codegen
        run: npm run generate

      - name: Apply nightly rustfmt to generated Rust output
        working-directory: ./rust
        run: cargo +nightly-2026-04-14 fmt --all -- --config-path .rustfmt.nightly.toml

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'cd scripts/codegen && npm run generate' and commit the changes."
            git diff --stat
            git diff
            exit 1
          fi

      - name: Verify Java protocol version matches
        run: |
          EXPECTED=$(jq -r '.version' sdk-protocol-version.json)
          ACTUAL=$(grep -oP 'LATEST\(\K[0-9]+' java/sdk/src/main/java/com/github/copilot/SdkProtocolVersion.java)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Java SDK protocol version ($ACTUAL) does not match sdk-protocol-version.json ($EXPECTED). Java manages its own SdkProtocolVersion.java via java/scripts/codegen/. Update it to match."
            exit 1
          fi
          echo "✅ Generated files are up-to-date"
