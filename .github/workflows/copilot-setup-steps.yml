name: "Copilot Setup Steps"

# This workflow configures the environment for GitHub Copilot Agent
# Automatically run the setup steps when they are changed to allow for easy validation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest

    # Set minimal permissions for setup steps
    # Copilot Agent receives its own token with appropriate permissions
    permissions:
      contents: read

    steps:
      # Checkout the repository to install dependencies
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Setup Node.js (for TypeScript/JavaScript SDK and tooling)
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            ./nodejs/package-lock.json
            ./test/harness/package-lock.json
            ./java/scripts/codegen/package-lock.json

      # Setup Python (for Python SDK)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Setup uv (Python package manager used in this repo)
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # Setup Go (for Go SDK)
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"

      # Setup .NET (for .NET SDK)
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Setup Java (for Java SDK)
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "microsoft"
          java-version: "17"
          cache: "maven"

      # Install just command runner
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Install gh-aw extension for advanced GitHub CLI features
      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@c9a91649fa6263a455ef783f7c06a96940052fec # v0.89.7
        with:
          version: v0.82.10

      # Install JavaScript dependencies
      - name: Install Node.js dependencies
        working-directory: ./nodejs
        run: npm ci --ignore-scripts

      # Install Python dependencies
      - name: Install Python dependencies
        working-directory: ./python
        run: uv sync --all-extras --dev

      # Install Go dependencies
      - name: Install Go dependencies
        working-directory: ./go
        run: go mod download

      # Restore .NET dependencies
      - name: Restore .NET dependencies
        working-directory: ./dotnet
        run: dotnet restore

      # Install test harness dependencies
      - name: Install test harness dependencies
        working-directory: ./test/harness
        run: npm ci --ignore-scripts

      # Install Java codegen dependencies
      - name: Install Java codegen dependencies
        working-directory: ./java/scripts/codegen
        run: npm ci

      # Verify installations
      - name: Verify tool installations
        run: |
          echo "=== Verifying installations ==="
          node --version
          npm --version
          python --version
          uv --version
          go version
          dotnet --version
          java -version
          mvn --version
          just --version
          gh --version
          gh aw version
          echo "✅ All tools installed successfully"
