name: "Copilot Setup Steps"

# This workflow configures the environment for GitHub Copilot Agent
# Automatically run the setup steps when they are changed to allow for easy validation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest

    # Set minimal permissions for setup steps
    # Copilot Agent receives its own token with appropriate permissions
    permissions:
      contents: read

    steps:
      # Checkout the repository to install dependencies
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Setup Node.js (for TypeScript/JavaScript SDK and tooling)
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            ./nodejs/package-lock.json
            ./test/harness/package-lock.json
            ./java/scripts/codegen/package-lock.json

      # Setup Python (for Python SDK)
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Setup uv (Python package manager used in this repo)
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # Setup Go (for Go SDK)
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24"

      # Setup .NET (for .NET SDK)
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      # Setup Java (for Java SDK)
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "microsoft"
          java-version: "17"
          cache: "maven"

      # Install just command runner
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      # Install gh-aw extension for advanced GitHub CLI features
      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@05205436a78512d71a2d842e46586ed05f4fa058 # v0.82.10
        with:
          version: v0.82.10

      # Install JavaScript dependencies
      - name: Install Node.js dependencies
        working-directory: ./nodejs
        run: npm ci --ignore-scripts

      # Install Python dependencies
      - name: Install Python dependencies
        working-directory: ./python
        run: uv sync --all-extras --dev

      # Install Go dependencies
      - name: Install Go dependencies
        working-directory: ./go
        run: go mod download

      # Restore .NET dependencies
      - name: Restore .NET dependencies
        working-directory: ./dotnet
        run: dotnet restore

      # Install test harness dependencies
      - name: Install test harness dependencies
        working-directory: ./test/harness
        run: npm ci --ignore-scripts

      # Install Java codegen dependencies
      - name: Install Java codegen dependencies
        working-directory: ./java/scripts/codegen
        run: npm ci

      # Verify installations
      - name: Verify tool installations
        run: |
          echo "=== Verifying installations ==="
          node --version
          npm --version
          python --version
          uv --version
          go version
          dotnet --version
          java -version
          mvn --version
          just --version
          gh --version
          gh aw version
          echo "✅ All tools installed successfully"
