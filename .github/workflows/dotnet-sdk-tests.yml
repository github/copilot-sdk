name: ".NET SDK Tests"

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: ".NET SDK Build and Format"
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ./dotnet
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Run dotnet format check
        run: |
          if ! dotnet format --no-restore --verify-no-changes; then
            echo "❌ dotnet format produced changes. Please run 'dotnet format' in dotnet"
            exit 1
          fi
          echo "✅ dotnet format produced no changes"

      # Build the whole solution once to validate every SDK target framework.
      # Matrix cells below only need to build frameworks consumed by the tests.
      - name: Build SDK
        run: dotnet build --no-restore

  test:
    name: ".NET SDK Tests (${{ matrix.os }}, ${{ matrix.transport }}, ${{ matrix.backend }}, ${{ matrix.shard }})"
    if: github.event.repository.fork == false
    env:
      POWERSHELL_UPDATECHECK: Off
      COPILOT_SDK_E2E_BACKEND: ${{ matrix.backend }}
      DOTNET_TEST_FILTER: ${{ matrix.test-filter }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        transport: ["default", "inprocess"]
        backend: [capi]
        shard: [full]
        # TODO: Re-enable after fixing in-process sqlite file locking on shutdown on Windows.
        exclude:
          - os: windows-latest
            transport: "inprocess"
          - os: windows-latest
            transport: default
            shard: full
          # TODO(cli-1.0.81-2): CLI 1.0.81-5 still stops completing in-process
          # CAPI model turns, causing repeated per-test timeouts until the
          # 30-minute job limit. Stdio CAPI and in-process BYOK remain enabled.
          - os: ubuntu-latest
            transport: inprocess
          - os: macos-latest
            transport: inprocess
          # The macOS default/capi host runs the whole suite on the smallest
          # runner in the matrix (3 vCPU / 7 GB vs ubuntu's 4 / 16). Since the
          # 1.0.81-2 bump it stopped finishing: the job ran 50+ minutes until
          # the runner lost communication with the server, and a runner that
          # dies that way uploads no logs at all, so the failure could not be
          # diagnosed from CI output. Split it across isolated hosts so one
          # poisoned runtime cannot consume the entire job without diagnostics.
          - os: macos-latest
            transport: default
            shard: full
        include:
          # Keep xUnit serial within each process, but split the slow Windows
          # default-transport suite across two isolated test hosts. Keep both
          # target frameworks in each shard: separate framework jobs did not
          # shorten the critical path and doubled the Windows job count.
          - os: windows-latest
            transport: default
            backend: capi
            shard: "1"
          - os: windows-latest
            transport: default
            backend: capi
            shard: "2"
          - os: macos-latest
            transport: default
            backend: capi
            shard: "1"
          - os: macos-latest
            transport: default
            backend: capi
            shard: "2a"
          - os: macos-latest
            transport: default
            backend: capi
            shard: "2b1a-permission-provider"
          - os: macos-latest
            transport: default
            backend: capi
            shard: "2b1a-rewind"
          - os: macos-latest
            transport: default
            backend: capi
            shard: "2b1a-rpc-a"
          - os: macos-latest
            transport: default
            backend: capi
            shard: "2b1a-rpc-e"
          - os: macos-latest
            transport: default
            backend: capi
            shard: "2b1b-mcp-and-skills"
          - os: macos-latest
            transport: default
            backend: capi
            shard: "2b1b-mcp-config"
          - os: macos-latest
            transport: default
            backend: capi
            shard: "2b1b-mcp-lifecycle"
          - os: macos-latest
            transport: default
            backend: capi
            shard: "2b1b-queue"
          - os: macos-latest
            transport: default
            backend: capi
            shard: "2b1b-remote"
          - os: macos-latest
            transport: default
            backend: capi
            shard: "2b2"
          # Standalone extension tests require the legacy JavaScript entrypoint.
          # Keep its subprocess tree isolated from the rest of the O/P/R shard.
          - os: macos-latest
            transport: default
            backend: capi
            shard: extensions
          - os: macos-latest
            transport: default
            backend: capi
            shard: "2c"
          - os: ubuntu-latest
            transport: inprocess
            backend: anthropic-messages
            shard: full
            test-filter: "FullyQualifiedName~GitHub.Copilot.Test.E2E&E2EBackend!=SelfConfiguredBackend&E2EBackend!=CapiOnly"
          - os: ubuntu-latest
            transport: inprocess
            backend: openai-responses
            shard: full
            test-filter: "FullyQualifiedName~GitHub.Copilot.Test.E2E&E2EBackend!=SelfConfiguredBackend&E2EBackend!=CapiOnly"
          - os: ubuntu-latest
            transport: inprocess
            backend: openai-completions
            shard: full
            test-filter: "FullyQualifiedName~GitHub.Copilot.Test.E2E&E2EBackend!=SelfConfiguredBackend&E2EBackend!=CapiOnly"
    runs-on: ${{ matrix.os }}
    # A hung test used to run until the runner died (~50 min) and the dying
    # runner never uploaded its logs, so the failures were undiagnosable.
    # Every healthy cell finishes well under 15 min.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ./dotnet
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            ./nodejs/package-lock.json
            ./test/harness/package-lock.json

      - name: Install Node.js dependencies
        working-directory: ./nodejs
        run: npm ci --ignore-scripts

      - name: Restore .NET dependencies
        run: dotnet restore test/GitHub.Copilot.SDK.Test.csproj

      - name: Install test harness dependencies
        working-directory: ./test/harness
        run: npm ci --ignore-scripts

      - name: Warm up PowerShell
        if: runner.os == 'Windows'
        run: pwsh.exe -Command "Write-Host 'PowerShell ready'"

      - name: Select inprocess transport
        if: matrix.transport == 'inprocess'
        run: echo "COPILOT_SDK_DEFAULT_CONNECTION=inprocess" >> "$GITHUB_ENV"

      - name: Run .NET SDK tests
        env:
          COPILOT_HMAC_KEY: ${{ secrets.COPILOT_DEVELOPER_CLI_INTEGRATION_HMAC_KEY }}
          DOTNET_TEST_SHARD: ${{ matrix.shard }}
        run: |
          # --blame-hang names the offending test instead of letting it wedge
          # the runner. No single test legitimately runs for 10 minutes; the
          # whole suite normally finishes in about five.
          # The validation job performs the full analyzer-enabled SDK build.
          # Build only test-consumed frameworks here and do not repeat analyzers.
          args=(
            --no-restore
            -v n
            --blame-hang
            --blame-hang-timeout 10m
            --blame-hang-dump-type none
            --logger "trx;LogFilePrefix=test-results"
            --results-directory "$GITHUB_WORKSPACE/dotnet/TestResults"
            -p:RunAnalyzers=false
          )

          filter="$DOTNET_TEST_FILTER"
          individual_filters=()
          if [[ "$DOTNET_TEST_SHARD" != "full" ]]; then
            case "$DOTNET_TEST_SHARD" in
              1)
                # M moved here after recent runs showed shard 2 was about two
                # minutes slower; this keeps Windows and macOS balanced.
                initials=(A C D H I J K L M N Q S U W Y)
                shard_filter="FullyQualifiedName~GitHub.Copilot.Test.ConnectionToken"
                ;;
              2)
                initials=(B E F G O P R T V X Z)
                shard_filter=""
                ;;
              2a)
                initials=(B E F G)
                shard_filter=""
                ;;
              2b1a-permission-provider)
                initials=()
                shard_filter=""
                individual_filters=(
                  "FullyQualifiedName~GitHub.Copilot.Test.E2E.PendingWorkResumeE2ETests"
                  "FullyQualifiedName~GitHub.Copilot.Test.E2E.PerSessionAuthE2ETests"
                  "FullyQualifiedName~GitHub.Copilot.Test.E2E.PermissionE2ETests"
                  "FullyQualifiedName~GitHub.Copilot.Test.E2E.PreMcpToolCallHookE2ETests"
                  "FullyQualifiedName~GitHub.Copilot.Test.E2E.ProviderEndpointE2ETests"
                  "FullyQualifiedName~GitHub.Copilot.Test.Unit.PermissionHandlerTests"
                  "FullyQualifiedName~GitHub.Copilot.Test.Unit.PublicDtoTests"
                )
                ;;
              2b1a-rewind)
                initials=()
                shard_filter="FullyQualifiedName~GitHub.Copilot.Test.E2E.Rewind"
                ;;
              2b1a-rpc-a)
                initials=()
                shard_filter="FullyQualifiedName~GitHub.Copilot.Test.E2E.RpcA"
                ;;
              2b1a-rpc-e)
                initials=()
                shard_filter="FullyQualifiedName~GitHub.Copilot.Test.E2E.RpcE"
                shard_exclusion="FullyQualifiedName!~GitHub.Copilot.Test.E2E.RpcExtensionsLoadedE2ETests"
                ;;
              2b1b-mcp-and-skills)
                initials=()
                shard_filter="FullyQualifiedName~GitHub.Copilot.Test.E2E.RpcMcpAndSkillsE2ETests"
                ;;
              2b1b-mcp-config)
                initials=()
                shard_filter="FullyQualifiedName~GitHub.Copilot.Test.E2E.RpcMcpConfigE2ETests"
                ;;
              2b1b-mcp-lifecycle)
                initials=()
                shard_filter="FullyQualifiedName~GitHub.Copilot.Test.E2E.RpcMcpLifecycleE2ETests"
                ;;
              2b1b-queue)
                initials=()
                shard_filter="FullyQualifiedName~GitHub.Copilot.Test.E2E.RpcQ"
                ;;
              2b1b-remote)
                initials=()
                shard_filter="FullyQualifiedName~GitHub.Copilot.Test.E2E.RpcR"
                ;;
              2b2)
                initials=()
                shard_filter="FullyQualifiedName~GitHub.Copilot.Test.E2E.RpcS|FullyQualifiedName~GitHub.Copilot.Test.E2E.RpcT|FullyQualifiedName~GitHub.Copilot.Test.E2E.RpcU|FullyQualifiedName~GitHub.Copilot.Test.E2E.RpcW|FullyQualifiedName~GitHub.Copilot.Test.Unit.R"
                ;;
              extensions)
                initials=()
                shard_filter="FullyQualifiedName~GitHub.Copilot.Test.E2E.RpcExtensionsLoadedE2ETests"
                ;;
              2c)
                initials=(T V X Z)
                shard_filter=""
                ;;
            esac

            if (( ${#individual_filters[@]} > 0 )); then
              for individual_filter in "${individual_filters[@]}"; do
                combined_filter="${filter:+(${filter})&}(${individual_filter})"
                dotnet test test/GitHub.Copilot.SDK.Test.csproj "${args[@]}" --filter "$combined_filter"
              done
              exit 0
            fi

            for namespace in E2E Unit; do
              for initial in "${initials[@]}"; do
                clause="FullyQualifiedName~GitHub.Copilot.Test.${namespace}.${initial}"
                shard_filter="${shard_filter:+${shard_filter}|}${clause}"
              done
            done
            filter="${filter:+(${filter})&}(${shard_filter})"
          fi

          if [[ -n "$filter" ]]; then
            args+=(--filter "$filter")
          fi
          dotnet test test/GitHub.Copilot.SDK.Test.csproj "${args[@]}"

      - name: Upload .NET test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dotnet-test-diagnostics-${{ matrix.os }}-${{ matrix.transport }}-${{ matrix.backend }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: dotnet/TestResults/
          if-no-files-found: warn
          retention-days: 7
