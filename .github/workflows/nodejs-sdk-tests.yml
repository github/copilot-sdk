name: "Node.js SDK Tests"

env:
  HUSKY: 0

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: "Node.js SDK Build and Validation"
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ./nodejs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "npm"
          cache-dependency-path: "./nodejs/package-lock.json"
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run prettier check
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
      - name: Typecheck SDK
        run: npm run typecheck
      - name: Build SDK
        run: npm run build
      - name: Build and verify release packages
        run: |
          npm run pack:release
          npm run verify:release-packages
      - name: Install test harness dependencies
        working-directory: ./test/harness
        run: npm ci --ignore-scripts
      - name: Run test harness tests
        working-directory: ./test/harness
        run: npm test

  test:
    name: "Node.js SDK Tests (${{ matrix.os }}, ${{ matrix.transport }})"
    if: github.event.repository.fork == false
    env:
      POWERSHELL_UPDATECHECK: Off
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        transport: ["default", "inprocess"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ./nodejs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "npm"
          cache-dependency-path: "./nodejs/package-lock.json"
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build SDK
        run: npm run build

      - name: Install test harness dependencies
        working-directory: ./test/harness
        run: npm ci --ignore-scripts

      - name: Prepare Copilot CLI runtime
        run: |
          runtime_path=$(npm run --silent prepare:runtime -- --print-path)
          echo "COPILOT_CLI_PATH=$runtime_path" >> "$GITHUB_ENV"

      - name: Warm up PowerShell
        if: runner.os == 'Windows'
        run: pwsh.exe -Command "Write-Host 'PowerShell ready'"

      - name: Select inprocess transport
        if: matrix.transport == 'inprocess'
        run: |
          echo "COPILOT_SDK_DEFAULT_CONNECTION=inprocess" >> "$GITHUB_ENV"

      - name: Run Node.js SDK tests
        env:
          COPILOT_HMAC_KEY: ${{ secrets.COPILOT_DEVELOPER_CLI_INTEGRATION_HMAC_KEY }}
        run: npm test

  # JavaScript actions use a glibc-linked Node runtime, so Alpine runs through Docker.
  test-musl-arm64:
    name: "Node.js SDK Tests (Alpine ARM64, ${{ matrix.transport }})"
    if: github.event.repository.fork == false
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        transport: ["default", "inprocess"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Alpine ARM64 tests (${{ matrix.transport }})
        uses: ./.github/actions/run-alpine-tests
        env:
          COPILOT_HMAC_KEY: ${{ secrets.COPILOT_DEVELOPER_CLI_INTEGRATION_HMAC_KEY }}
        with:
          image: node:22-alpine
          workdir: /workspace/nodejs
          transport: ${{ matrix.transport }}
          command: |
            npm ci --ignore-scripts
            npm run build
            (cd /workspace/test/harness && npm ci --ignore-scripts)

            runtime_path="$(npm run --silent prepare:runtime -- --print-path)"
            case "$runtime_path" in
              */prebuilds/linuxmusl-arm64/copilot-runtime) ;;
              *)
                echo "Expected the linuxmusl-arm64 runtime bundle, got: $runtime_path" >&2
                exit 1
                ;;
            esac
            test -x "$runtime_path"
            test -f "$(dirname "$runtime_path")/runtime.node"
            export COPILOT_CLI_PATH="$runtime_path"
            npm test
