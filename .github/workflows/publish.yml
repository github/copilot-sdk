name: Publish SDK packages

env:
  HUSKY: 0

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "Tag to publish under"
        type: choice
        required: true
        default: "prerelease"
        options:
          - latest
          - prerelease
          - unstable
      version:
        description: "Version override (optional, e.g., 1.0.0). If empty, auto-increments."
        type: string
        required: false
      runtime_version:
        description: "Exact signed runtime version (required for unstable)"
        type: string
        required: false
      runtime_sha:
        description: "Full github/copilot-agent-runtime SHA (required for unstable)"
        type: string
        required: false
      runtime_source:
        description: "Runtime package source (required for unstable)"
        type: choice
        required: false
        options:
          - github-packages
      runtime_run_id:
        description: "Source runtime workflow run ID (required for unstable)"
        type: string
        required: false
      resume_run_id:
        description: "Exceptional recovery: original SDK workflow run ID"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.dist-tag == 'unstable' && 'unstable' || 'release' }}
  cancel-in-progress: false

jobs:
  # Shared job to calculate version once for all publish jobs
  version:
    name: Calculate Version
    if: inputs.dist-tag != 'unstable'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      current: ${{ steps.version.outputs.CURRENT }}
      current-prerelease: ${{ steps.version.outputs.CURRENT_PRERELEASE }}
    defaults:
      run:
        working-directory: ./nodejs
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - run: npm ci --ignore-scripts
      - name: Get version
        id: version
        run: |
          CURRENT="$(node scripts/get-version.js current)"
          echo "CURRENT=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current latest version: $CURRENT" >> $GITHUB_STEP_SUMMARY
          CURRENT_PRERELEASE="$(node scripts/get-version.js current-prerelease)"
          echo "CURRENT_PRERELEASE=$CURRENT_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Current prerelease version: $CURRENT_PRERELEASE" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            # Validate version format matches dist-tag
            if [ "${{ github.event.inputs.dist-tag }}" = "latest" ]; then
              if [[ "$VERSION" == *-* ]]; then
                echo "❌ Error: Version '$VERSION' has a prerelease suffix but dist-tag is 'latest'" >> $GITHUB_STEP_SUMMARY
                echo "Use a version without suffix (e.g., '1.0.0') for latest releases"
                exit 1
              fi
            else
              if [[ "$VERSION" != *-* ]]; then
                echo "❌ Error: Version '$VERSION' has no prerelease suffix but dist-tag is '${{ github.event.inputs.dist-tag }}'" >> $GITHUB_STEP_SUMMARY
                echo "Use a version with suffix (e.g., '1.0.0-preview.0') for prerelease/unstable"
                exit 1
              fi
            fi
            echo "Using manual version override: $VERSION" >> $GITHUB_STEP_SUMMARY
          else
            VERSION="$(node scripts/get-version.js ${{ github.event.inputs.dist-tag }})"
            echo "Auto-incremented version: $VERSION" >> $GITHUB_STEP_SUMMARY
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Verify version is available on public npm
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          node scripts/npm-release.js preflight \
            @github/copilot-sdk \
            "$VERSION" \
            https://registry.npmjs.org

  package-nodejs:
    name: Package Node.js SDK
    if: inputs.dist-tag != 'unstable'
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./nodejs
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - run: npm ci --ignore-scripts
      - name: Set version
        run: node scripts/set-version.js
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - name: Build
        run: npm run build
      - name: Pack
        run: |
          npm run pack:release
          TARBALL_COUNT="$(find . -maxdepth 1 -name 'github-copilot-sdk-*.tgz' | wc -l | tr -d ' ')"
          if [ "$TARBALL_COUNT" -ne 9 ]; then
            echo "::error::Expected nine Node.js package tarballs, found $TARBALL_COUNT."
            exit 1
          fi
          npm run verify:release-packages
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: nodejs-package
          path: nodejs/github-copilot-sdk-*.tgz
          if-no-files-found: error

  publish-nodejs:
    name: Publish Node.js SDK
    needs: [version, package-nodejs]
    if: inputs.dist-tag != 'unstable' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Update npm for OIDC support
        run: npm i -g "npm@11.6.3"
      - name: Download Node.js package
        uses: actions/download-artifact@v8.0.0
        with:
          name: nodejs-package
          path: ./dist
      - name: Publish tarball to public npm
        env:
          DIST_TAG: ${{ github.event.inputs.dist-tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TARBALLS=(./dist/*.tgz)
          if [ "${#TARBALLS[@]}" -ne 9 ]; then
            echo "::error::Expected nine Node.js package tarballs, found ${#TARBALLS[@]}."
            exit 1
          fi
          MAIN_TARBALL=""
          for TARBALL in "${TARBALLS[@]}"; do
            PACKAGE_NAME="$(tar -xOf "$TARBALL" package/package.json | jq -r .name)"
            if [ "$PACKAGE_NAME" = "@github/copilot-sdk" ]; then
              MAIN_TARBALL="$TARBALL"
              continue
            fi
            INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
            node nodejs/scripts/npm-release.js publish \
              "$TARBALL" \
              "$PACKAGE_NAME" \
              "$VERSION" \
              "$DIST_TAG" \
              https://registry.npmjs.org \
              public \
              "$INTEGRITY"
          done
          if [ -z "$MAIN_TARBALL" ]; then
            echo "::error::Main @github/copilot-sdk tarball not found."
            exit 1
          fi
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$MAIN_TARBALL" | openssl base64 -A)"
          node nodejs/scripts/npm-release.js publish \
            "$MAIN_TARBALL" \
            @github/copilot-sdk \
            "$VERSION" \
            "$DIST_TAG" \
            https://registry.npmjs.org \
            public \
            "$INTEGRITY"

  publish-nodejs-internal:
    name: Publish Node.js SDK to internal feed
    needs: [version, publish-nodejs]
    environment: cicd
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      ADO_RESOURCE: 499b84ac-1321-427f-aa17-267ca6975798
      FEED_URL: https://pkgs.dev.azure.com/devdiv/_packaging/copilot-canary/npm/registry/
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Download Node.js package
        uses: actions/download-artifact@v8.0.0
        with:
          name: nodejs-package
          path: ./dist
      - name: Azure Login (OIDC -> id-cpd-ci)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: "${{ vars.CPD_ID_CLIENT_ID }}" # id-cpd-ci
          tenant-id: "${{ vars.CPD_ID_TENANT_ID }}"
          allow-no-subscriptions: true
      - name: Configure feed auth
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource "$ADO_RESOURCE" --query accessToken -o tsv)"
          echo "::add-mask::$TOKEN"
          FEED_AUTH_REGISTRY="${FEED_URL#https:}"
          FEED_AUTH_BASE="${FEED_AUTH_REGISTRY%registry/}"
          printf '%s\n' \
            "${FEED_AUTH_REGISTRY}:_authToken=${TOKEN}" \
            "${FEED_AUTH_BASE}:_authToken=${TOKEN}" > "$HOME/.npmrc"
      - name: Publish tarball to internal feed
        env:
          DIST_TAG: ${{ github.event.inputs.dist-tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$FEED_URL" != "https://pkgs.dev.azure.com/devdiv/_packaging/copilot-canary/npm/registry/" ]; then
            echo "::error::FEED_URL ('$FEED_URL') is not the expected internal feed. Refusing to publish."
            exit 1
          fi
          shopt -s nullglob
          TARBALLS=(./dist/*.tgz)
          if [ "${#TARBALLS[@]}" -ne 9 ]; then
            echo "::error::Expected nine Node.js package tarballs, found ${#TARBALLS[@]}."
            exit 1
          fi
          MAIN_TARBALL=""
          for TARBALL in "${TARBALLS[@]}"; do
            PACKAGE_NAME="$(tar -xOf "$TARBALL" package/package.json | jq -r .name)"
            if [ "$PACKAGE_NAME" = "@github/copilot-sdk" ]; then
              MAIN_TARBALL="$TARBALL"
              continue
            fi
            INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
            node nodejs/scripts/npm-release.js publish \
              "$TARBALL" \
              "$PACKAGE_NAME" \
              "$VERSION" \
              "$DIST_TAG" \
              "$FEED_URL" \
              azure \
              "$INTEGRITY"
          done
          if [ -z "$MAIN_TARBALL" ]; then
            echo "::error::Main @github/copilot-sdk tarball not found."
            exit 1
          fi
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$MAIN_TARBALL" | openssl base64 -A)"
          node nodejs/scripts/npm-release.js publish \
            "$MAIN_TARBALL" \
            @github/copilot-sdk \
            "$VERSION" \
            "$DIST_TAG" \
            "$FEED_URL" \
            azure \
            "$INTEGRITY"

  unstable-plan:
    name: Freeze unstable release identity
    if: inputs.dist-tag == 'unstable'
    runs-on: ubuntu-latest
    environment: cicd
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.recover.outputs.artifact_name || steps.plan.outputs.artifact_name }}
      runtime_run_id: ${{ steps.recover.outputs.runtime_run_id || steps.plan.outputs.runtime_run_id }}
      runtime_sha: ${{ steps.recover.outputs.runtime_sha || steps.plan.outputs.runtime_sha }}
      runtime_version: ${{ steps.recover.outputs.runtime_version || steps.plan.outputs.runtime_version }}
      sdk_ref: ${{ steps.recover.outputs.sdk_ref || steps.plan.outputs.sdk_ref }}
      sdk_sha: ${{ steps.recover.outputs.sdk_sha || steps.plan.outputs.sdk_sha }}
      sdk_version: ${{ steps.recover.outputs.sdk_version || steps.plan.outputs.sdk_version }}
      workflow_created_at: ${{ steps.recover.outputs.workflow_created_at || steps.plan.outputs.workflow_created_at }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./nodejs/package-lock.json
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: ./nodejs
      - name: Download original retained release
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v8.0.0
        with:
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ./recovery
          pattern: nodejs-unstable-*
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Validate exceptional recovery identity
        if: inputs.resume_run_id != ''
        id: recover
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]] ||
            { echo "::error::resume_run_id must be numeric."; exit 1; }
          MANIFEST="./recovery/release-manifest.json"
          [ -f "$MANIFEST" ] ||
            { echo "::error::Original run does not contain one retained unstable release artifact."; exit 1; }
          node nodejs/node_modules/.bin/tsx nodejs/scripts/release-manifest.ts verify "$MANIFEST" ./recovery
          [ "$(jq -r .channel "$MANIFEST")" = "unstable" ] ||
            { echo "::error::Recovery artifact is not an unstable release."; exit 1; }
          [ "$(jq -r .workflow.runId "$MANIFEST")" = "$RESUME_RUN_ID" ] ||
            { echo "::error::Manifest workflow run ID does not match resume_run_id."; exit 1; }
          {
            echo "artifact_name=nodejs-unstable-$(jq -r .sdk.version "$MANIFEST")"
            echo "runtime_run_id=$(jq -r .runtime.runId "$MANIFEST")"
            echo "runtime_sha=$(jq -r .runtime.sha "$MANIFEST")"
            echo "runtime_version=$(jq -r .runtime.version "$MANIFEST")"
            echo "sdk_ref=$(jq -r .sdk.ref "$MANIFEST")"
            echo "sdk_sha=$(jq -r .sdk.sha "$MANIFEST")"
            echo "sdk_version=$(jq -r .sdk.version "$MANIFEST")"
            echo "workflow_created_at=$(jq -r .workflow.createdAt "$MANIFEST")"
          } >> "$GITHUB_OUTPUT"
      - name: Validate runtime handoff and calculate version
        if: inputs.resume_run_id == ''
        id: plan
        working-directory: ./nodejs
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          SDK_SHA: ${{ github.sha }}
          SDK_VERSION_OVERRIDE: ${{ inputs.version }}
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          [ "$RUNTIME_SOURCE" = "github-packages" ] ||
            { echo "::error::Unstable runtime_source must be github-packages."; exit 1; }
          [[ "$RUNTIME_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] ||
            { echo "::error::runtime_version must be exact SemVer."; exit 1; }
          [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::runtime_sha must be a lowercase full SHA."; exit 1; }
          [[ "$RUNTIME_RUN_ID" =~ ^[0-9]+$ ]] ||
            { echo "::error::runtime_run_id must be numeric."; exit 1; }
          WORKFLOW_CREATED_AT="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s 'add' > "$RUNNER_TEMP/sdk-releases.json"
          export SDK_RELEASES_FILE="$RUNNER_TEMP/sdk-releases.json"
          export WORKFLOW_CREATED_AT
          SDK_VERSION="$(npx tsx scripts/unstable-version.ts)"
          if [ -n "$SDK_VERSION_OVERRIDE" ]; then
            for PACKAGE in \
              @github/copilot-sdk \
              @github/copilot-sdk-darwin-arm64 \
              @github/copilot-sdk-darwin-x64 \
              @github/copilot-sdk-linux-arm64 \
              @github/copilot-sdk-linux-x64 \
              @github/copilot-sdk-linuxmusl-arm64 \
              @github/copilot-sdk-linuxmusl-x64 \
              @github/copilot-sdk-win32-arm64 \
              @github/copilot-sdk-win32-x64; do
              node scripts/npm-release.js preflight "$PACKAGE" "$SDK_VERSION" https://registry.npmjs.org
            done
          fi
          {
            echo "artifact_name=nodejs-unstable-$SDK_VERSION"
            echo "runtime_run_id=$RUNTIME_RUN_ID"
            echo "runtime_sha=$RUNTIME_SHA"
            echo "runtime_version=$RUNTIME_VERSION"
            echo "sdk_ref=$GITHUB_REF"
            echo "sdk_sha=$SDK_SHA"
            echo "sdk_version=$SDK_VERSION"
            echo "workflow_created_at=$WORKFLOW_CREATED_AT"
          } >> "$GITHUB_OUTPUT"
      - name: Azure login for explicit-version preflight
        if: inputs.resume_run_id == '' && inputs.version != ''
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          allow-no-subscriptions: true
          client-id: ${{ vars.CPD_ID_CLIENT_ID }}
          tenant-id: ${{ vars.CPD_ID_TENANT_ID }}
      - name: Reject an explicit version already present internally
        if: inputs.resume_run_id == '' && inputs.version != ''
        working-directory: ./nodejs
        env:
          ADO_RESOURCE: 499b84ac-1321-427f-aa17-267ca6975798
          FEED_URL: https://pkgs.dev.azure.com/devdiv/_packaging/copilot-canary/npm/registry/
          SDK_VERSION: ${{ steps.plan.outputs.sdk_version }}
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource "$ADO_RESOURCE" --query accessToken -o tsv)"
          echo "::add-mask::$TOKEN"
          FEED_AUTH_REGISTRY="${FEED_URL#https:}"
          FEED_AUTH_BASE="${FEED_AUTH_REGISTRY%registry/}"
          printf '%s\n' \
            "${FEED_AUTH_REGISTRY}:_authToken=${TOKEN}" \
            "${FEED_AUTH_BASE}:_authToken=${TOKEN}" > "$HOME/.npmrc"
          for PACKAGE in \
            @github/copilot-sdk \
            @github/copilot-sdk-darwin-arm64 \
            @github/copilot-sdk-darwin-x64 \
            @github/copilot-sdk-linux-arm64 \
            @github/copilot-sdk-linux-x64 \
            @github/copilot-sdk-linuxmusl-arm64 \
            @github/copilot-sdk-linuxmusl-x64 \
            @github/copilot-sdk-win32-arm64 \
            @github/copilot-sdk-win32-x64; do
            node scripts/npm-release.js preflight "$PACKAGE" "$SDK_VERSION" "$FEED_URL"
          done

  unstable-runtime-backed-release:
    name: Run unstable SDK pipeline
    if: inputs.dist-tag == 'unstable'
    needs: unstable-plan
    uses: ./.github/workflows/runtime-backed-node-release.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    with:
      artifact_name: ${{ needs.unstable-plan.outputs.artifact_name }}
      channel: unstable
      mode: internal
      resume_run_id: ${{ inputs.resume_run_id }}
      runtime_run_id: ${{ needs.unstable-plan.outputs.runtime_run_id }}
      runtime_sha: ${{ needs.unstable-plan.outputs.runtime_sha }}
      runtime_source: github-packages
      runtime_version: ${{ needs.unstable-plan.outputs.runtime_version }}
      sdk_ref: ${{ needs.unstable-plan.outputs.sdk_ref }}
      sdk_sha: ${{ needs.unstable-plan.outputs.sdk_sha }}
      sdk_version: ${{ needs.unstable-plan.outputs.sdk_version }}
    secrets: inherit

  unstable-publish-public:
    name: Publish unstable SDK publicly
    if: inputs.dist-tag == 'unstable'
    needs: [unstable-plan, unstable-runtime-backed-release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: ./nodejs
      - name: Update npm for trusted publishing
        run: npm install --global npm@11.6.3
      - name: Download current retained release
        if: inputs.resume_run_id == ''
        uses: actions/download-artifact@v8.0.0
        with:
          name: ${{ needs.unstable-plan.outputs.artifact_name }}
          path: ./dist
      - name: Download original retained release
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v8.0.0
        with:
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ./dist
          pattern: ${{ needs.unstable-plan.outputs.artifact_name }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Validate retained release
        run: |
          node nodejs/node_modules/.bin/tsx nodejs/scripts/release-manifest.ts verify dist/release-manifest.json dist
      - name: Publish the same tarballs to public npm
        run: |
          node nodejs/scripts/npm-release.js publish-manifest \
            dist/release-manifest.json dist unstable https://registry.npmjs.org public

  publish-dotnet:
    name: Publish .NET SDK
    if: github.event.inputs.dist-tag != 'unstable'
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./dotnet
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore
      - name: Build and pack
        run: dotnet pack src/GitHub.Copilot.SDK.csproj -c Release -p:Version=${{ needs.version.outputs.version }} -o ./artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: dotnet-package
          path: |
            dotnet/artifacts/*.nupkg
            dotnet/artifacts/*.snupkg
      - name: NuGet login (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # The following must be a username, not an organization name, and that user must have configured Trusted Publishing
          # for this owner/repo/workflow combination in their NuGet.org account settings. We could set up a dedicated user for
          # this purpose if needed, but then we'd have to manage that account separately. Other GitHub-owned packages on NuGet
          # are associated with individual maintainers' accounts too.
          user: stevesanderson
      - name: Publish to NuGet
        if: github.ref == 'refs/heads/main'
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          dotnet nuget push ./artifacts/*.snupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-rust:
    name: Publish Rust SDK
    if: github.event.inputs.dist-tag != 'unstable'
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust"
      - name: Set version
        run: sed -i -E 's/^version = ".*"$/version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - name: Snapshot CLI version + hashes for build.rs
        run: |
          bash scripts/snapshot-bundled-cli-version.sh
          bash scripts/snapshot-bundled-in-process-version.sh
      - name: Verify CLI version snapshots exist
        run: |
          for snapshot in cli-version.txt cli-version-in-process.txt; do
            if [[ ! -f "${snapshot}" ]]; then
              echo "::error::${snapshot} was not generated. The Snapshot step must run before packaging."
              exit 1
            fi
          done
      - name: Package (dry run)
        run: cargo publish --dry-run --allow-dirty
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: rust-package
          path: rust/target/package/*.crate
      - name: Publish to crates.io
        if: github.ref == 'refs/heads/main'
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-python:
    name: Publish Python SDK
    if: github.event.inputs.dist-tag != 'unstable'
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./python
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Set version
        run: sed -i "s/^version = .*/version = \"${{ needs.version.outputs.version }}\"/" pyproject.toml
      - name: Inject CLI version
        run: node scripts/inject-cli-version.mjs
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: python-package
          path: python/dist/*
      - name: Publish to PyPI
        if: github.ref == 'refs/heads/main'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  publish-java:
    name: Publish Java SDK
    if: github.event.inputs.dist-tag != 'unstable' && github.ref == 'refs/heads/main'
    needs: version
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/java-publish-maven.yml
    with:
      releaseVersion: ${{ needs.version.outputs.version }}
      prerelease: ${{ github.event.inputs.dist-tag == 'prerelease' }}
    secrets: inherit

  github-release:
    name: Create GitHub Release
    needs:
      [
        version,
        publish-nodejs,
        publish-dotnet,
        publish-python,
        publish-rust,
        publish-java,
      ]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.dist-tag != 'unstable' &&
      needs.version.result == 'success' &&
      needs.publish-nodejs.result == 'success' &&
      needs.publish-dotnet.result == 'success' &&
      needs.publish-python.result == 'success' &&
      needs.publish-rust.result == 'success' &&
      needs.publish-java.outputs.mavenPublished == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Create GitHub Release
        if: github.event.inputs.dist-tag == 'latest'
        run: |
          NOTES_FLAG=""
          if git rev-parse "v${{ needs.version.outputs.current }}" >/dev/null 2>&1; then
            NOTES_FLAG="--notes-start-tag v${{ needs.version.outputs.current }}"
          fi
          gh release create "v${{ needs.version.outputs.version }}" \
            --title "v${{ needs.version.outputs.version }}" \
            --generate-notes $NOTES_FLAG \
            --target ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Pre-Release
        if: github.event.inputs.dist-tag == 'prerelease'
        run: |
          NOTES_FLAG=""
          if git rev-parse "v${{ needs.version.outputs.current-prerelease }}" >/dev/null 2>&1; then
            NOTES_FLAG="--notes-start-tag v${{ needs.version.outputs.current-prerelease }}"
          fi
          gh release create "v${{ needs.version.outputs.version }}" \
            --prerelease \
            --title "v${{ needs.version.outputs.version }}" \
            --generate-notes $NOTES_FLAG \
            --target ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger changelog generation
        run: gh workflow run release-changelog.lock.yml -f tag="v${{ needs.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag Go SDK submodule
        if: github.event.inputs.dist-tag == 'latest' || github.event.inputs.dist-tag == 'prerelease'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags
          TAG_NAME="go/v${{ needs.version.outputs.version }}"
          # Try to create the tag - will fail if it already exists
          if git tag "$TAG_NAME" ${{ github.sha }} 2>/dev/null; then
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "$TAG_NAME"
            echo "Created and pushed tag $TAG_NAME"
          else
            echo "Tag $TAG_NAME already exists, skipping"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag Rust SDK
        # Keep a language-scoped source tag for traceability. Rust is
        # included in the cross-language `vX.Y.Z` GitHub Release.
        if: github.event.inputs.dist-tag == 'latest' || github.event.inputs.dist-tag == 'prerelease'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags
          VERSION="${{ needs.version.outputs.version }}"
          TAG_NAME="rust/v${VERSION}"
          if git tag "$TAG_NAME" ${{ github.sha }} 2>/dev/null; then
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "$TAG_NAME"
            echo "Created and pushed tag $TAG_NAME"
          else
            echo "Tag $TAG_NAME already exists, skipping tag push"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
