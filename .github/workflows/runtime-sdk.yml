name: Runtime-driven Node SDK
run-name: Runtime-driven SDK from runtime run ${{ inputs.runtime_run_id }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - canary
          - unstable
      runtime_version:
        description: "Exact runtime package version"
        required: true
        type: string
      runtime_sha:
        description: "Full github/copilot-agent-runtime source SHA"
        required: true
        type: string
      runtime_source:
        description: "Runtime package registry"
        required: true
        type: choice
        options:
          - azure
          - github-packages
      runtime_run_id:
        description: "Source runtime workflow run ID and idempotency key"
        required: true
        type: string
      mode:
        description: "tests-only for canary verification; internal for publication"
        required: true
        type: choice
        options:
          - tests-only
          - internal
        default: internal
      version:
        description: "Unstable SDK version override for a direct manual run"
        required: false
        type: string

permissions:
  contents: read

jobs:
  claim-runtime-dispatch:
    name: Claim runtime dispatch
    runs-on: ubuntu-latest
    concurrency:
      group: sdk-runtime-dispatch-${{ inputs.runtime_run_id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    outputs:
      canonical_run_id: ${{ steps.existing.outputs.canonical_run_id || steps.created.outputs.canonical_run_id }}
      role: ${{ steps.existing.outputs.role || steps.created.outputs.role }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./nodejs/package-lock.json
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: ./nodejs
      - name: Validate entry boundary
        env:
          CHANNEL: ${{ inputs.channel }}
          MODE: ${{ inputs.mode }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$CHANNEL:$RUNTIME_SOURCE:$MODE" in
            canary:azure:tests-only|canary:azure:internal|unstable:github-packages:internal) ;;
            *) echo "::error::Invalid runtime-driven release matrix: $CHANNEL/$RUNTIME_SOURCE/$MODE."; exit 1 ;;
          esac
          [[ "$RUNTIME_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] ||
            { echo "::error::runtime_version must be exact SemVer."; exit 1; }
          [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::runtime_sha must be a lowercase full SHA."; exit 1; }
          [[ "$RUNTIME_RUN_ID" =~ ^[0-9]+$ ]] ||
            { echo "::error::runtime_run_id must be numeric."; exit 1; }
          if [ "$CHANNEL" = "canary" ] && [ -n "$VERSION" ]; then
            echo "::error::Canary runs do not accept a version override."
            exit 1
          fi
      - name: Find the canonical dispatch marker
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER_NAME: sdk-runtime-dispatch-${{ inputs.runtime_run_id }}
          RUN_TITLE: Runtime-driven SDK from runtime run ${{ inputs.runtime_run_id }}
        run: |
          set -euo pipefail
          for ATTEMPT in 1 2 3 4 5 6; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$MARKER_NAME&per_page=100" \
              > "$RUNNER_TEMP/artifacts.json"
            MATCHES="$(jq --arg name "$MARKER_NAME" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              "$RUNNER_TEMP/artifacts.json")"
            if [ "$MATCHES" -gt 1 ]; then
              echo "::error::More than one unexpired $MARKER_NAME artifact exists."
              exit 1
            fi
            if [ "$MATCHES" -eq 1 ]; then
              jq --arg name "$MARKER_NAME" \
                '.artifacts[] | select(.name == $name and .expired == false)' \
                "$RUNNER_TEMP/artifacts.json" > "$RUNNER_TEMP/artifact.json"
              {
                echo "found=true"
                echo "artifact_id=$(jq -r .id "$RUNNER_TEMP/artifact.json")"
                echo "artifact_run_id=$(jq -r .workflow_run.id "$RUNNER_TEMP/artifact.json")"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/runtime-sdk.yml/runs?event=workflow_dispatch&per_page=100" \
              > "$RUNNER_TEMP/runs.json"
            EARLIER="$(jq --arg title "$RUN_TITLE" --argjson current "$GITHUB_RUN_ID" \
              '[.workflow_runs[] | select(.display_title == $title and .id < $current)] | length' \
              "$RUNNER_TEMP/runs.json")"
            if [ "$EARLIER" -eq 0 ] && [ "$GITHUB_RUN_ATTEMPT" -eq 1 ]; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$ATTEMPT" -lt 6 ]; then
              echo "An earlier matching run is visible; waiting for its marker (attempt $ATTEMPT/6)."
              sleep 10
            fi
          done

          ACTIVE="$(jq --arg title "$RUN_TITLE" --argjson current "$GITHUB_RUN_ID" \
            '[.workflow_runs[] | select(
              .display_title == $title and
              .id < $current and
              .status != "completed"
            )] | length' "$RUNNER_TEMP/runs.json")"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "::error::An earlier matching run is still initializing without a visible marker. Retry this run later."
            exit 1
          fi
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo "::error::This rerun's canonical marker is not visible. Retry after the artifact index is consistent."
            exit 1
          fi
          echo "Earlier matching runs completed before claiming; none could have started release work."
          echo "found=false" >> "$GITHUB_OUTPUT"
      - name: Download the existing marker
        if: steps.lookup.outputs.found == 'true'
        env:
          ARTIFACT_ID: ${{ steps.lookup.outputs.artifact_id }}
          ARTIFACT_RUN_ID: ${{ steps.lookup.outputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/marker"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/marker.zip"
          unzip -q "$RUNNER_TEMP/marker.zip" -d "$RUNNER_TEMP/marker"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" > "$RUNNER_TEMP/run.json"
      - name: Validate the existing marker and API provenance
        if: steps.lookup.outputs.found == 'true'
        id: existing
        env:
          CHANNEL: ${{ inputs.channel }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          MODE: ${{ inputs.mode }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          SDK_REF: ${{ github.ref }}
          SDK_SHA: ${{ github.sha }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          node nodejs/node_modules/.bin/tsx nodejs/scripts/runtime-dispatch-ledger.ts validate \
            "$RUNNER_TEMP/marker/marker.json" "$RUNNER_TEMP/artifact.json" "$RUNNER_TEMP/run.json"
      - name: Mirror the canonical run
        if: steps.existing.outputs.role == 'duplicate'
        env:
          CANONICAL_RUN_ID: ${{ steps.existing.outputs.canonical_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run watch "$CANONICAL_RUN_ID" --exit-status
          RESULT=$?
          set -e
          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Canonical SDK run $CANONICAL_RUN_ID failed or was canceled. Re-run that original run; this duplicate will not mint another SDK version."
            exit "$RESULT"
          fi
          echo "Canonical SDK run $CANONICAL_RUN_ID succeeded; this duplicate is complete."
      - name: Create the canonical marker
        if: steps.lookup.outputs.found == 'false'
        id: created
        env:
          CHANNEL: ${{ inputs.channel }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          MODE: ${{ inputs.mode }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          SDK_REF: ${{ github.ref }}
          SDK_SHA: ${{ github.sha }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/new-marker"
          node nodejs/node_modules/.bin/tsx nodejs/scripts/runtime-dispatch-ledger.ts create \
            "$RUNNER_TEMP/new-marker/marker.json"
          {
            echo "role=owner"
            echo "canonical_run_id=$GITHUB_RUN_ID"
          } >> "$GITHUB_OUTPUT"
      - name: Persist the canonical marker
        if: steps.lookup.outputs.found == 'false'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: sdk-runtime-dispatch-${{ inputs.runtime_run_id }}
          path: ${{ runner.temp }}/new-marker/marker.json
          retention-days: 90

  plan:
    name: Freeze runtime-backed release identity
    if: needs.claim-runtime-dispatch.outputs.role == 'owner'
    needs: claim-runtime-dispatch
    runs-on: ubuntu-latest
    environment: cicd
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      sdk_version: ${{ steps.plan.outputs.sdk_version }}
      workflow_created_at: ${{ steps.plan.outputs.workflow_created_at }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./nodejs/package-lock.json
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: ./nodejs
      - name: Calculate the release identity
        id: plan
        working-directory: ./nodejs
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
          SDK_SHA: ${{ github.sha }}
          SDK_VERSION_OVERRIDE: ${{ inputs.version }}
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          WORKFLOW_CREATED_AT="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          SDK_VERSION=""
          ARTIFACT_NAME=""
          if [ "$CHANNEL" = "unstable" ]; then
            gh api --paginate "/repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -s 'add' > "$RUNNER_TEMP/sdk-releases.json"
            export SDK_RELEASES_FILE="$RUNNER_TEMP/sdk-releases.json"
            export WORKFLOW_CREATED_AT
            SDK_VERSION="$(npx tsx scripts/unstable-version.ts)"
            ARTIFACT_NAME="nodejs-unstable-$SDK_VERSION"
          fi
          {
            echo "artifact_name=$ARTIFACT_NAME"
            echo "sdk_version=$SDK_VERSION"
            echo "workflow_created_at=$WORKFLOW_CREATED_AT"
          } >> "$GITHUB_OUTPUT"
      - name: Reject an explicit version already present publicly
        if: needs.claim-runtime-dispatch.outputs.role == 'owner' && inputs.channel == 'unstable' && inputs.version != ''
        working-directory: ./nodejs
        env:
          SDK_VERSION: ${{ steps.plan.outputs.sdk_version }}
        run: |
          for PACKAGE in \
            @github/copilot-sdk \
            @github/copilot-sdk-darwin-arm64 \
            @github/copilot-sdk-darwin-x64 \
            @github/copilot-sdk-linux-arm64 \
            @github/copilot-sdk-linux-x64 \
            @github/copilot-sdk-linuxmusl-arm64 \
            @github/copilot-sdk-linuxmusl-x64 \
            @github/copilot-sdk-win32-arm64 \
            @github/copilot-sdk-win32-x64; do
            node scripts/npm-release.js preflight "$PACKAGE" "$SDK_VERSION" https://registry.npmjs.org
          done
      - name: Azure login for explicit-version preflight
        if: needs.claim-runtime-dispatch.outputs.role == 'owner' && inputs.channel == 'unstable' && inputs.version != ''
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          allow-no-subscriptions: true
          client-id: ${{ vars.CPD_ID_CLIENT_ID }}
          tenant-id: ${{ vars.CPD_ID_TENANT_ID }}
      - name: Reject an explicit version already present internally
        if: needs.claim-runtime-dispatch.outputs.role == 'owner' && inputs.channel == 'unstable' && inputs.version != ''
        working-directory: ./nodejs
        env:
          ADO_RESOURCE: 499b84ac-1321-427f-aa17-267ca6975798
          FEED_URL: https://pkgs.dev.azure.com/devdiv/_packaging/copilot-canary/npm/registry/
          SDK_VERSION: ${{ steps.plan.outputs.sdk_version }}
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource "$ADO_RESOURCE" --query accessToken -o tsv)"
          echo "::add-mask::$TOKEN"
          FEED_AUTH_REGISTRY="${FEED_URL#https:}"
          FEED_AUTH_BASE="${FEED_AUTH_REGISTRY%registry/}"
          printf '%s\n' \
            "${FEED_AUTH_REGISTRY}:_authToken=${TOKEN}" \
            "${FEED_AUTH_BASE}:_authToken=${TOKEN}" > "$HOME/.npmrc"
          for PACKAGE in \
            @github/copilot-sdk \
            @github/copilot-sdk-darwin-arm64 \
            @github/copilot-sdk-darwin-x64 \
            @github/copilot-sdk-linux-arm64 \
            @github/copilot-sdk-linux-x64 \
            @github/copilot-sdk-linuxmusl-arm64 \
            @github/copilot-sdk-linuxmusl-x64 \
            @github/copilot-sdk-win32-arm64 \
            @github/copilot-sdk-win32-x64; do
            node scripts/npm-release.js preflight "$PACKAGE" "$SDK_VERSION" "$FEED_URL"
          done

  runtime-backed-release:
    name: Run runtime-backed SDK pipeline
    if: needs.claim-runtime-dispatch.outputs.role == 'owner'
    needs: [claim-runtime-dispatch, plan]
    uses: ./.github/workflows/runtime-backed-node-release.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    with:
      artifact_name: ${{ needs.plan.outputs.artifact_name }}
      channel: ${{ inputs.channel }}
      mode: ${{ inputs.mode }}
      runtime_run_id: ${{ inputs.runtime_run_id }}
      runtime_sha: ${{ inputs.runtime_sha }}
      runtime_source: ${{ inputs.runtime_source }}
      runtime_version: ${{ inputs.runtime_version }}
      sdk_ref: ${{ github.ref }}
      sdk_sha: ${{ github.sha }}
      sdk_version: ${{ needs.plan.outputs.sdk_version }}
    secrets: inherit

  publish-public:
    name: Publish unstable SDK publicly
    if: inputs.channel == 'unstable' && needs.claim-runtime-dispatch.outputs.role == 'owner'
    needs: [claim-runtime-dispatch, plan, runtime-backed-release]
    runs-on: ubuntu-latest
    concurrency:
      group: sdk-runtime-public-unstable
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: ./nodejs
      - name: Update npm for trusted publishing
        run: npm install --global npm@11.6.3
      - name: Download retained release
        uses: actions/download-artifact@v8.0.0
        with:
          name: ${{ needs.runtime-backed-release.outputs.artifact_name }}
          path: ./dist
      - name: Validate retained release
        run: |
          node nodejs/node_modules/.bin/tsx nodejs/scripts/release-manifest.ts verify \
            dist/release-manifest.json dist
      - name: Publish the same tarballs to public npm
        run: |
          node nodejs/scripts/npm-release.js publish-manifest \
            dist/release-manifest.json dist unstable https://registry.npmjs.org public
