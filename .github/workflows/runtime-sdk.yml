name: Runtime-driven Node SDK
run-name: Runtime-driven SDK from runtime run ${{ inputs.runtime_run_id }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - canary
          - unstable
      runtime_version:
        description: "Exact runtime package version"
        required: true
        type: string
      runtime_sha:
        description: "Full github/copilot-agent-runtime source SHA"
        required: true
        type: string
      runtime_source:
        description: "Runtime package registry"
        required: true
        type: choice
        options:
          - azure
          - github-packages
      runtime_run_id:
        description: "Source runtime workflow run ID and idempotency key"
        required: true
        type: string
      mode:
        description: "tests-only for canary verification; internal for publication"
        required: true
        type: choice
        options:
          - tests-only
          - internal
        default: internal
      version:
        description: "Unstable SDK version override for a direct manual run"
        required: false
        type: string

permissions:
  contents: read

env:
  ADO_RESOURCE: 499b84ac-1321-427f-aa17-267ca6975798
  FEED_URL: https://pkgs.dev.azure.com/devdiv/_packaging/copilot-canary/npm/registry/
  HUSKY: 0

jobs:
  claim-runtime-dispatch:
    name: Claim runtime dispatch
    runs-on: ubuntu-latest
    concurrency:
      group: sdk-runtime-dispatch-${{ inputs.runtime_run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    outputs:
      canonical_run_id: ${{ steps.claim.outputs.canonical_run_id }}
      role: ${{ steps.claim.outputs.role }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./nodejs/package-lock.json
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: ./nodejs
      - name: Claim or resolve the canonical dispatch
        id: claim
        env:
          CHANNEL: ${{ inputs.channel }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          SDK_REF: ${{ github.ref }}
          SDK_SHA: ${{ github.sha }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: node nodejs/node_modules/.bin/tsx nodejs/scripts/runtime-dispatch-ledger.ts claim "$RUNNER_TEMP/new-marker/marker.json"
      - name: Mirror the canonical run
        if: steps.claim.outputs.role == 'duplicate'
        env:
          CANONICAL_RUN_ID: ${{ steps.claim.outputs.canonical_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run watch "$CANONICAL_RUN_ID" --exit-status
          RESULT=$?
          set -e
          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Canonical SDK run $CANONICAL_RUN_ID failed or was canceled. Re-run that original run; this duplicate will not mint another SDK version."
            exit "$RESULT"
          fi
          echo "Canonical SDK run $CANONICAL_RUN_ID succeeded; this duplicate is complete."
      - name: Persist the canonical marker
        if: steps.claim.outputs.created == 'true'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: sdk-runtime-dispatch-${{ inputs.runtime_run_id }}
          path: ${{ runner.temp }}/new-marker/marker.json
          retention-days: 90

  plan:
    name: Freeze runtime-backed release identity
    if: needs.claim-runtime-dispatch.outputs.role == 'owner'
    needs: claim-runtime-dispatch
    runs-on: ubuntu-latest
    environment: cicd
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      sdk_version: ${{ steps.plan.outputs.sdk_version }}
      workflow_created_at: ${{ steps.plan.outputs.workflow_created_at }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./nodejs/package-lock.json
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: ./nodejs
      - name: Calculate the release identity
        id: plan
        working-directory: ./nodejs
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
          SDK_SHA: ${{ github.sha }}
          SDK_VERSION_OVERRIDE: ${{ inputs.version }}
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          WORKFLOW_CREATED_AT="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          if [ "$CHANNEL" = "canary" ]; then
            PUBLIC_LATEST="$(node scripts/get-version.js current)"
            BASE="$(node -e '
              const semver = require("semver");
              const parsed = semver.parse(process.argv[1]);
              if (!parsed) process.exit(1);
              process.stdout.write(`${parsed.major}.${parsed.minor}.${parsed.patch}`);
            ' "$PUBLIC_LATEST")" ||
              { echo "::error::Current public SDK version is not valid SemVer: $PUBLIC_LATEST"; exit 1; }
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            SDK_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-canary.${GITHUB_RUN_NUMBER}.g${SDK_SHA:0:7}"
          else
            gh api --paginate "/repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -s 'add' > "$RUNNER_TEMP/sdk-releases.json"
            export SDK_RELEASES_FILE="$RUNNER_TEMP/sdk-releases.json"
            export WORKFLOW_CREATED_AT
            SDK_VERSION="$(npx tsx scripts/unstable-version.ts)"
          fi
          npm exec -- semver "$SDK_VERSION" >/dev/null
          ARTIFACT_NAME="nodejs-${CHANNEL}-${SDK_VERSION}"
          {
            echo "artifact_name=$ARTIFACT_NAME"
            echo "sdk_version=$SDK_VERSION"
            echo "workflow_created_at=$WORKFLOW_CREATED_AT"
          } >> "$GITHUB_OUTPUT"
      - name: Reject an explicit version already present publicly
        if: needs.claim-runtime-dispatch.outputs.role == 'owner' && inputs.channel == 'unstable' && inputs.version != ''
        working-directory: ./nodejs
        env:
          SDK_VERSION: ${{ steps.plan.outputs.sdk_version }}
        run: node scripts/npm-release.js preflight-package-set "$SDK_VERSION" https://registry.npmjs.org
      - name: Azure login for explicit-version preflight
        if: needs.claim-runtime-dispatch.outputs.role == 'owner' && inputs.channel == 'unstable' && inputs.version != ''
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          allow-no-subscriptions: true
          client-id: ${{ vars.CPD_ID_CLIENT_ID }}
          tenant-id: ${{ vars.CPD_ID_TENANT_ID }}
      - name: Reject an explicit version already present internally
        if: needs.claim-runtime-dispatch.outputs.role == 'owner' && inputs.channel == 'unstable' && inputs.version != ''
        working-directory: ./nodejs
        env:
          ADO_RESOURCE: 499b84ac-1321-427f-aa17-267ca6975798
          FEED_URL: https://pkgs.dev.azure.com/devdiv/_packaging/copilot-canary/npm/registry/
          SDK_VERSION: ${{ steps.plan.outputs.sdk_version }}
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource "$ADO_RESOURCE" --query accessToken -o tsv)"
          echo "::add-mask::$TOKEN"
          FEED_AUTH_REGISTRY="${FEED_URL#https:}"
          FEED_AUTH_BASE="${FEED_AUTH_REGISTRY%registry/}"
          printf '%s\n' \
            "${FEED_AUTH_REGISTRY}:_authToken=${TOKEN}" \
            "${FEED_AUTH_BASE}:_authToken=${TOKEN}" > "$HOME/.npmrc"
          node scripts/npm-release.js preflight-package-set "$SDK_VERSION" "$FEED_URL"

  acquire-runtime:
    name: Acquire exact runtime packages
    needs: plan
    runs-on: ubuntu-latest
    environment: cicd
    permissions:
      contents: read
      id-token: write
      packages: read
    defaults:
      run:
        shell: bash
        working-directory: ./nodejs
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./nodejs/package-lock.json
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Azure login
        if: inputs.runtime_source == 'azure'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          allow-no-subscriptions: true
          client-id: ${{ vars.CPD_ID_CLIENT_ID }}
          tenant-id: ${{ vars.CPD_ID_TENANT_ID }}
      - name: Configure authentication-only Azure npm access
        if: inputs.runtime_source == 'azure'
        run: |
          TOKEN="$(az account get-access-token --resource "$ADO_RESOURCE" --query accessToken -o tsv)"
          echo "::add-mask::$TOKEN"
          FEED_AUTH_REGISTRY="${FEED_URL#https:}"
          FEED_AUTH_BASE="${FEED_AUTH_REGISTRY%registry/}"
          printf '%s\n' \
            "${FEED_AUTH_REGISTRY}:_authToken=${TOKEN}" \
            "${FEED_AUTH_BASE}:_authToken=${TOKEN}" > "$HOME/.npmrc"
      - name: Configure authentication-only GitHub Packages access
        if: inputs.runtime_source == 'github-packages'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
      - name: Download and validate all runtime platforms
        env:
          REGISTRY: ${{ inputs.runtime_source == 'azure' && env.FEED_URL || 'https://npm.pkg.github.com' }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          npm run acquire:runtime-packages -- \
            --version "$RUNTIME_VERSION" \
            --sha "$RUNTIME_SHA" \
            --registry "$REGISTRY" \
            --output "$RUNNER_TEMP/runtime-packages"
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: runtime-${{ inputs.channel }}-${{ inputs.runtime_version }}-${{ inputs.runtime_sha }}
          path: ${{ runner.temp }}/runtime-packages
          if-no-files-found: error
          retention-days: 7

  test:
    name: Runtime-backed Node tests (${{ matrix.os }})
    needs: [plan, acquire-runtime]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    environment: cicd
    defaults:
      run:
        shell: bash
        working-directory: ./nodejs
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./nodejs/package-lock.json
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Install test harness dependencies
        working-directory: ./test/harness
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8.0.0
        with:
          name: runtime-${{ inputs.channel }}-${{ inputs.runtime_version }}-${{ inputs.runtime_sha }}
          path: ${{ runner.temp }}/runtime-packages
      - name: Select the acquired runtime
        env:
          COPILOT_SDK_RUNTIME_PACKAGE_DIR: ${{ runner.temp }}/runtime-packages
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          node scripts/set-cli-version.js "$RUNTIME_VERSION" --local-package
          runtime_path="$(npm run --silent prepare:runtime -- --print-path)"
          echo "COPILOT_CLI_PATH=$runtime_path" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Warm up PowerShell
        if: runner.os == 'Windows'
        run: pwsh.exe -Command "Write-Host 'PowerShell ready'"
      - name: Run Node SDK tests
        env:
          COPILOT_HMAC_KEY: ${{ secrets.COPILOT_DEVELOPER_CLI_INTEGRATION_HMAC_KEY }}
        run: npm test

  package:
    name: Build and verify nine SDK packages
    needs: [plan, acquire-runtime, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ./nodejs
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./nodejs/package-lock.json
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8.0.0
        with:
          name: runtime-${{ inputs.channel }}-${{ inputs.runtime_version }}-${{ inputs.runtime_sha }}
          path: ${{ runner.temp }}/runtime-packages
      - name: Build and verify exact package set
        env:
          COPILOT_SDK_RUNTIME_PACKAGE_DIR: ${{ runner.temp }}/runtime-packages
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          SDK_VERSION: ${{ needs.plan.outputs.sdk_version }}
        run: |
          VERSION="$SDK_VERSION" node scripts/set-version.js
          node scripts/set-cli-version.js "$RUNTIME_VERSION" --local-package
          grep -F "COPILOT_CLI_USE_NPM_PACKAGE = false" src/cliVersion.ts
          npm run build
          npm run pack:release
          npm run verify:release-packages
      - name: Create immutable release manifest
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          SDK_REF: ${{ github.ref }}
          SDK_SHA: ${{ github.sha }}
          SDK_VERSION: ${{ needs.plan.outputs.sdk_version }}
          WORKFLOW_CREATED_AT: ${{ needs.plan.outputs.workflow_created_at }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
        run: |
          npm run release:manifest -- create release-manifest.json .
          npm run release:manifest -- verify release-manifest.json .
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: |
            nodejs/release-manifest.json
            nodejs/github-copilot-sdk-*.tgz
          if-no-files-found: error
          retention-days: 30

  publish-internal:
    name: Publish and verify SDK internally
    if: |
      always() &&
      !cancelled() &&
      inputs.mode == 'internal' &&
      needs.plan.result == 'success' &&
      needs.package.result == 'success'
    needs: [plan, package]
    runs-on: ubuntu-latest
    concurrency:
      group: sdk-runtime-internal-${{ inputs.channel }}
      cancel-in-progress: false
      queue: max
    environment: cicd
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: ./nodejs
      - name: Download retained release
        uses: actions/download-artifact@v8.0.0
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: ./dist
      - name: Validate retained release
        run: |
          node nodejs/node_modules/.bin/tsx nodejs/scripts/release-manifest.ts verify dist/release-manifest.json dist
          [ "$(jq -r .workflow.runId dist/release-manifest.json)" = "${{ github.run_id }}" ] ||
            { echo "::error::Retained release belongs to a different workflow run."; exit 1; }
          [ "$(jq -r .channel dist/release-manifest.json)" = "${{ inputs.channel }}" ] ||
            { echo "::error::Retained release channel does not match the requested channel."; exit 1; }
      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          allow-no-subscriptions: true
          client-id: ${{ vars.CPD_ID_CLIENT_ID }}
          tenant-id: ${{ vars.CPD_ID_TENANT_ID }}
      - name: Configure authentication-only Azure npm access
        run: |
          TOKEN="$(az account get-access-token --resource "$ADO_RESOURCE" --query accessToken -o tsv)"
          echo "::add-mask::$TOKEN"
          FEED_AUTH_REGISTRY="${FEED_URL#https:}"
          FEED_AUTH_BASE="${FEED_AUTH_REGISTRY%registry/}"
          printf '%s\n' \
            "${FEED_AUTH_REGISTRY}:_authToken=${TOKEN}" \
            "${FEED_AUTH_BASE}:_authToken=${TOKEN}" > "$HOME/.npmrc"
      - name: Publish exact tarballs internally
        run: |
          node nodejs/scripts/npm-release.js publish-manifest \
            dist/release-manifest.json dist "${{ inputs.channel }}" "$FEED_URL" azure
      - name: Clean install and package version check
        env:
          SDK_VERSION: ${{ needs.plan.outputs.sdk_version }}
        run: |
          VERIFY_ROOT="$RUNNER_TEMP/sdk-${{ inputs.channel }}-verification"
          mkdir -p "$VERIFY_ROOT"
          cd "$VERIFY_ROOT"
          npm init -y >/dev/null
          printf '%s\n' "@github:registry=${FEED_URL}" >> "$HOME/.npmrc"
          npm install --ignore-scripts "@github/copilot-sdk@${SDK_VERSION}"
          node -e '
            const expected = process.argv[1];
            const umbrella = require("./node_modules/@github/copilot-sdk/package.json");
            const platform = require("./node_modules/@github/copilot-sdk-linux-x64/package.json");
            if (umbrella.version !== expected || platform.version !== expected) {
              throw new Error(`Installed SDK package version mismatch: ${umbrella.version}/${platform.version}, expected ${expected}`);
            }
          ' "$SDK_VERSION"

  publish-public:
    name: Publish unstable SDK publicly
    if: inputs.channel == 'unstable' && needs.claim-runtime-dispatch.outputs.role == 'owner'
    needs: [claim-runtime-dispatch, plan, publish-internal]
    runs-on: ubuntu-latest
    concurrency:
      group: sdk-runtime-public-unstable
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: ./nodejs
      - name: Update npm for trusted publishing
        run: npm install --global npm@11.6.3
      - name: Download retained release
        uses: actions/download-artifact@v8.0.0
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: ./dist
      - name: Validate retained release
        run: |
          node nodejs/node_modules/.bin/tsx nodejs/scripts/release-manifest.ts verify \
            dist/release-manifest.json dist
      - name: Publish the same tarballs to public npm
        run: |
          node nodejs/scripts/npm-release.js publish-manifest \
            dist/release-manifest.json dist unstable https://registry.npmjs.org public
