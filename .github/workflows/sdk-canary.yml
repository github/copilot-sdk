name: "SDK Canary Test/Publish"

env:
  ADO_RESOURCE: 499b84ac-1321-427f-aa17-267ca6975798
  FEED_URL: https://pkgs.dev.azure.com/devdiv/_packaging/copilot-canary/npm/registry/
  HUSKY: 0

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - canary
        default: canary
      runtime_version:
        description: "Exact runtime package version"
        required: true
        type: string
      runtime_sha:
        description: "Full github/copilot-agent-runtime source SHA"
        required: true
        type: string
      runtime_source:
        description: "Runtime package registry"
        required: true
        type: choice
        options:
          - azure
        default: azure
      runtime_run_id:
        description: "Source runtime workflow run ID"
        required: true
        type: string
      mode:
        description: "Run tests and package verification, with optional internal publication"
        required: true
        type: choice
        options:
          - tests-only
          - internal
        default: tests-only
  repository_dispatch:
    types: [runtime-canary]

permissions:
  contents: read
  id-token: write

concurrency:
  group: sdk-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve canary inputs
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      mode: ${{ steps.normalize.outputs.mode }}
      runtime_run_id: ${{ steps.normalize.outputs.runtime_run_id }}
      runtime_sha: ${{ steps.normalize.outputs.runtime_sha }}
      runtime_source: ${{ steps.normalize.outputs.runtime_source }}
      runtime_version: ${{ steps.normalize.outputs.runtime_version }}
    steps:
      - name: Normalize and validate inputs
        id: normalize
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          INPUT_RUNTIME_SHA: ${{ inputs.runtime_sha }}
          INPUT_RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          INPUT_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          PAYLOAD_CHANNEL: ${{ github.event.client_payload.channel }}
          PAYLOAD_MODE: ${{ github.event.client_payload.mode }}
          PAYLOAD_RUNTIME_RUN_ID: ${{ github.event.client_payload.runtime_run_id }}
          PAYLOAD_RUNTIME_SHA: ${{ github.event.client_payload.runtime_sha }}
          PAYLOAD_RUNTIME_SOURCE: ${{ github.event.client_payload.runtime_source }}
          PAYLOAD_RUNTIME_VERSION: ${{ github.event.client_payload.runtime_version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CHANNEL="$INPUT_CHANNEL"
            MODE="$INPUT_MODE"
            RUNTIME_RUN_ID="$INPUT_RUNTIME_RUN_ID"
            RUNTIME_SHA="$INPUT_RUNTIME_SHA"
            RUNTIME_SOURCE="$INPUT_RUNTIME_SOURCE"
            RUNTIME_VERSION="$INPUT_RUNTIME_VERSION"
          else
            CHANNEL="${PAYLOAD_CHANNEL:-canary}"
            MODE="${PAYLOAD_MODE:-internal}"
            RUNTIME_RUN_ID="$PAYLOAD_RUNTIME_RUN_ID"
            RUNTIME_SHA="$PAYLOAD_RUNTIME_SHA"
            RUNTIME_SOURCE="${PAYLOAD_RUNTIME_SOURCE:-azure}"
            RUNTIME_VERSION="$PAYLOAD_RUNTIME_VERSION"
            case "$MODE" in
              publish|publish-force) MODE="internal" ;;
            esac
            case "$RUNTIME_SOURCE" in
              internal) RUNTIME_SOURCE="azure" ;;
            esac
          fi
          [ "$CHANNEL" = "canary" ] || { echo "::error::sdk-canary.yml only accepts channel=canary."; exit 1; }
          [ "$RUNTIME_SOURCE" = "azure" ] || { echo "::error::Canary runtime_source must be azure."; exit 1; }
          case "$MODE" in
            tests-only|internal) ;;
            *) echo "::error::Canary mode must be tests-only or internal."; exit 1 ;;
          esac
          [[ "$RUNTIME_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] ||
            { echo "::error::runtime_version must be exact SemVer."; exit 1; }
          [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::runtime_sha must be a lowercase full SHA."; exit 1; }
          [[ "$RUNTIME_RUN_ID" =~ ^[0-9]+$ ]] ||
            { echo "::error::runtime_run_id must be numeric."; exit 1; }
          {
            echo "mode=$MODE"
            echo "runtime_run_id=$RUNTIME_RUN_ID"
            echo "runtime_sha=$RUNTIME_SHA"
            echo "runtime_source=$RUNTIME_SOURCE"
            echo "runtime_version=$RUNTIME_VERSION"
          } >> "$GITHUB_OUTPUT"

  acquire-runtime:
    name: Acquire exact runtime packages
    needs: resolve
    runs-on: ubuntu-latest
    environment: cicd
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: ./nodejs
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./nodejs/package-lock.json
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          allow-no-subscriptions: true
          client-id: ${{ vars.CPD_ID_CLIENT_ID }}
          tenant-id: ${{ vars.CPD_ID_TENANT_ID }}
      - name: Configure authentication-only Azure npm access
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource "$ADO_RESOURCE" --query accessToken -o tsv)"
          echo "::add-mask::$TOKEN"
          FEED_AUTH_REGISTRY="${FEED_URL#https:}"
          FEED_AUTH_BASE="${FEED_AUTH_REGISTRY%registry/}"
          printf '%s\n' \
            "${FEED_AUTH_REGISTRY}:_authToken=${TOKEN}" \
            "${FEED_AUTH_BASE}:_authToken=${TOKEN}" > "$HOME/.npmrc"
      - name: Download and validate all runtime platforms
        env:
          RUNTIME_SHA: ${{ needs.resolve.outputs.runtime_sha }}
          RUNTIME_VERSION: ${{ needs.resolve.outputs.runtime_version }}
        run: |
          npm run acquire:runtime-packages -- \
            --version "$RUNTIME_VERSION" \
            --sha "$RUNTIME_SHA" \
            --registry "$FEED_URL" \
            --output "$RUNNER_TEMP/runtime-packages"
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: canary-runtime-${{ needs.resolve.outputs.runtime_version }}-${{ needs.resolve.outputs.runtime_sha }}
          path: ${{ runner.temp }}/runtime-packages
          if-no-files-found: error
          retention-days: 7

  test:
    name: Runtime-backed Node tests (${{ matrix.os }})
    needs: [resolve, acquire-runtime]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    environment: cicd
    defaults:
      run:
        shell: bash
        working-directory: ./nodejs
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./nodejs/package-lock.json
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Install test harness dependencies
        working-directory: ./test/harness
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8.0.0
        with:
          name: canary-runtime-${{ needs.resolve.outputs.runtime_version }}-${{ needs.resolve.outputs.runtime_sha }}
          path: ${{ runner.temp }}/runtime-packages
      - name: Select the acquired runtime
        env:
          COPILOT_SDK_RUNTIME_PACKAGE_DIR: ${{ runner.temp }}/runtime-packages
          RUNTIME_VERSION: ${{ needs.resolve.outputs.runtime_version }}
        run: |
          set -euo pipefail
          node scripts/set-cli-version.js "$RUNTIME_VERSION" --local-package
          runtime_path="$(npm run --silent prepare:runtime -- --print-path)"
          "$runtime_path" --version | grep -F "$RUNTIME_VERSION"
          echo "COPILOT_CLI_PATH=$runtime_path" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Warm up PowerShell
        if: runner.os == 'Windows'
        run: pwsh.exe -Command "Write-Host 'PowerShell ready'"
      - name: Run Node SDK tests
        env:
          COPILOT_HMAC_KEY: ${{ secrets.COPILOT_DEVELOPER_CLI_INTEGRATION_HMAC_KEY }}
        run: npm test

  package:
    name: Build and verify nine SDK packages
    needs: [resolve, acquire-runtime, test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      sdk_version: ${{ steps.identity.outputs.sdk_version }}
    defaults:
      run:
        shell: bash
        working-directory: ./nodejs
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./nodejs/package-lock.json
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8.0.0
        with:
          name: canary-runtime-${{ needs.resolve.outputs.runtime_version }}-${{ needs.resolve.outputs.runtime_sha }}
          path: ${{ runner.temp }}/runtime-packages
      - name: Freeze SDK canary version
        id: identity
        env:
          SDK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PUBLIC_LATEST="$(node scripts/get-version.js current)"
          BASE="${PUBLIC_LATEST%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          SDK_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-canary.${GITHUB_RUN_NUMBER}.g${SDK_SHA:0:7}"
          npm exec -- semver "$SDK_VERSION"
          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=nodejs-canary-$SDK_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build package set
        env:
          COPILOT_SDK_RUNTIME_PACKAGE_DIR: ${{ runner.temp }}/runtime-packages
          RUNTIME_VERSION: ${{ needs.resolve.outputs.runtime_version }}
          SDK_VERSION: ${{ steps.identity.outputs.sdk_version }}
        run: |
          set -euo pipefail
          VERSION="$SDK_VERSION" node scripts/set-version.js
          node scripts/set-cli-version.js "$RUNTIME_VERSION" --local-package
          grep -F "COPILOT_CLI_USE_NPM_PACKAGE = false" src/cliVersion.ts
          npm run build
          npm run pack:release
          npm run verify:release-packages
      - name: Create retained release manifest
        env:
          RELEASE_CHANNEL: canary
          RUNTIME_RUN_ID: ${{ needs.resolve.outputs.runtime_run_id }}
          RUNTIME_SHA: ${{ needs.resolve.outputs.runtime_sha }}
          RUNTIME_SOURCE: azure
          RUNTIME_VERSION: ${{ needs.resolve.outputs.runtime_version }}
          SDK_REF: ${{ github.ref }}
          SDK_SHA: ${{ github.sha }}
          SDK_VERSION: ${{ steps.identity.outputs.sdk_version }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_CREATED_AT="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          export WORKFLOW_CREATED_AT
          npm run release:manifest -- create release-manifest.json .
          npm run release:manifest -- verify release-manifest.json .
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: |
            nodejs/release-manifest.json
            nodejs/github-copilot-sdk-*.tgz
          if-no-files-found: error
          retention-days: 30

  publish-internal:
    name: Publish and verify SDK canary internally
    if: needs.resolve.outputs.mode == 'internal'
    needs: [resolve, package]
    runs-on: ubuntu-latest
    environment: cicd
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: ./nodejs
      - uses: actions/download-artifact@v8.0.0
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ./dist
      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          allow-no-subscriptions: true
          client-id: ${{ vars.CPD_ID_CLIENT_ID }}
          tenant-id: ${{ vars.CPD_ID_TENANT_ID }}
      - name: Configure authentication-only Azure npm access
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource "$ADO_RESOURCE" --query accessToken -o tsv)"
          echo "::add-mask::$TOKEN"
          FEED_AUTH_REGISTRY="${FEED_URL#https:}"
          FEED_AUTH_BASE="${FEED_AUTH_REGISTRY%registry/}"
          printf '%s\n' \
            "${FEED_AUTH_REGISTRY}:_authToken=${TOKEN}" \
            "${FEED_AUTH_BASE}:_authToken=${TOKEN}" > "$HOME/.npmrc"
      - name: Publish exact manifest package set
        run: |
          node nodejs/scripts/npm-release.js publish-manifest \
            dist/release-manifest.json dist canary "$FEED_URL" azure
      - name: Clean install and runtime version check
        env:
          RUNTIME_VERSION: ${{ needs.resolve.outputs.runtime_version }}
          SDK_VERSION: ${{ needs.package.outputs.sdk_version }}
        run: |
          set -euo pipefail
          VERIFY_ROOT="$RUNNER_TEMP/sdk-canary-verification"
          mkdir -p "$VERIFY_ROOT"
          cd "$VERIFY_ROOT"
          npm init -y >/dev/null
          printf '%s\n' "@github:registry=${FEED_URL}" >> "$HOME/.npmrc"
          npm install --ignore-scripts "@github/copilot-sdk@${SDK_VERSION}"
          RUNTIME="./node_modules/@github/copilot-sdk-linux-x64/prebuilds/linux-x64/copilot-runtime"
          "$RUNTIME" --version | grep -F "$RUNTIME_VERSION"
