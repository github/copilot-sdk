name: "SDK Canary Test/Publish"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - canary
        default: canary
      runtime_version:
        description: "Exact runtime package version"
        required: true
        type: string
      runtime_sha:
        description: "Full github/copilot-agent-runtime source SHA"
        required: true
        type: string
      runtime_source:
        description: "Runtime package registry"
        required: true
        type: choice
        options:
          - azure
        default: azure
      runtime_run_id:
        description: "Source runtime workflow run ID"
        required: true
        type: string
      mode:
        description: "Run tests and package verification, with optional internal publication"
        required: true
        type: choice
        options:
          - tests-only
          - internal
        default: tests-only
  repository_dispatch:
    types: [runtime-canary]

permissions:
  contents: read
  id-token: write

concurrency:
  group: sdk-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve canary inputs
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      mode: ${{ steps.normalize.outputs.mode }}
      runtime_run_id: ${{ steps.normalize.outputs.runtime_run_id }}
      runtime_sha: ${{ steps.normalize.outputs.runtime_sha }}
      runtime_source: ${{ steps.normalize.outputs.runtime_source }}
      runtime_version: ${{ steps.normalize.outputs.runtime_version }}
    steps:
      - name: Normalize and validate inputs
        id: normalize
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          INPUT_RUNTIME_SHA: ${{ inputs.runtime_sha }}
          INPUT_RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          INPUT_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          PAYLOAD_CHANNEL: ${{ github.event.client_payload.channel }}
          PAYLOAD_MODE: ${{ github.event.client_payload.mode }}
          PAYLOAD_RUNTIME_RUN_ID: ${{ github.event.client_payload.runtime_run_id }}
          PAYLOAD_RUNTIME_SHA: ${{ github.event.client_payload.runtime_sha }}
          PAYLOAD_RUNTIME_SOURCE: ${{ github.event.client_payload.runtime_source }}
          PAYLOAD_RUNTIME_VERSION: ${{ github.event.client_payload.runtime_version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CHANNEL="$INPUT_CHANNEL"
            MODE="$INPUT_MODE"
            RUNTIME_RUN_ID="$INPUT_RUNTIME_RUN_ID"
            RUNTIME_SHA="$INPUT_RUNTIME_SHA"
            RUNTIME_SOURCE="$INPUT_RUNTIME_SOURCE"
            RUNTIME_VERSION="$INPUT_RUNTIME_VERSION"
          else
            CHANNEL="${PAYLOAD_CHANNEL:-canary}"
            MODE="${PAYLOAD_MODE:-internal}"
            RUNTIME_RUN_ID="$PAYLOAD_RUNTIME_RUN_ID"
            RUNTIME_SHA="$PAYLOAD_RUNTIME_SHA"
            RUNTIME_SOURCE="${PAYLOAD_RUNTIME_SOURCE:-azure}"
            RUNTIME_VERSION="$PAYLOAD_RUNTIME_VERSION"
            case "$MODE" in
              publish|publish-force) MODE="internal" ;;
            esac
            case "$RUNTIME_SOURCE" in
              internal) RUNTIME_SOURCE="azure" ;;
            esac
          fi
          [ "$CHANNEL" = "canary" ] || { echo "::error::sdk-canary.yml only accepts channel=canary."; exit 1; }
          [ "$RUNTIME_SOURCE" = "azure" ] || { echo "::error::Canary runtime_source must be azure."; exit 1; }
          case "$MODE" in
            tests-only|internal) ;;
            *) echo "::error::Canary mode must be tests-only or internal."; exit 1 ;;
          esac
          [[ "$RUNTIME_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] ||
            { echo "::error::runtime_version must be exact SemVer."; exit 1; }
          [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::runtime_sha must be a lowercase full SHA."; exit 1; }
          [[ "$RUNTIME_RUN_ID" =~ ^[0-9]+$ ]] ||
            { echo "::error::runtime_run_id must be numeric."; exit 1; }
          {
            echo "mode=$MODE"
            echo "runtime_run_id=$RUNTIME_RUN_ID"
            echo "runtime_sha=$RUNTIME_SHA"
            echo "runtime_source=$RUNTIME_SOURCE"
            echo "runtime_version=$RUNTIME_VERSION"
          } >> "$GITHUB_OUTPUT"

  runtime-backed-release:
    name: Run canary SDK pipeline
    needs: resolve
    uses: ./.github/workflows/runtime-backed-node-release.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      channel: canary
      mode: ${{ needs.resolve.outputs.mode }}
      runtime_run_id: ${{ needs.resolve.outputs.runtime_run_id }}
      runtime_sha: ${{ needs.resolve.outputs.runtime_sha }}
      runtime_source: ${{ needs.resolve.outputs.runtime_source }}
      runtime_version: ${{ needs.resolve.outputs.runtime_version }}
      sdk_ref: ${{ github.ref }}
      sdk_sha: ${{ github.sha }}
    secrets: inherit
