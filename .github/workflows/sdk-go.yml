# Invoked by sdk.yml to run Go SDK formatting, linting, samples, documentation,
# full subprocess coverage, and focused in-process smoke coverage across
# standard platforms and x64 musl.
name: "SDK Go"

env:
  HUSKY: 0
  POWERSHELL_UPDATECHECK: Off
  SDK_HOME: ${{ inputs.sdk-home }}
  SETUP_NODE_TIMEOUT_MINUTES: 10

on:
  workflow_call:
    inputs:
      platform:
        required: false
        type: string
        default: all
      sdk-home:
        required: true
        type: string

permissions:
  contents: read

jobs:
  go:
    name: "Go (${{ matrix.os }})"
    if: contains(fromJSON('["all","linux-x64","darwin-arm64","win32-x64"]'), inputs.platform)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux-x64' && '["ubuntu-latest"]' || inputs.platform == 'darwin-arm64' && '["macos-latest"]' || inputs.platform == 'win32-x64' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.sdk-home }}/go
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 4
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-sdk-runtime
        with:
          artifact-name: ${{ runner.os == 'Linux' && format('executable-sdk-{0}-{1}-gnu', runner.os, runner.arch) || format('executable-sdk-{0}-{1}', runner.os, runner.arch) }}
          path: ${{ github.workspace }}
      - run: node "$SDK_HOME/scripts/ci/runtime-artifact.mjs" restore && node "$SDK_HOME/scripts/ci/runtime-artifact.mjs" prepare
        working-directory: .
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: |
            ${{ inputs.sdk-home }}/go/go.sum
            ${{ inputs.sdk-home }}/go/samples/go.sum
      # TEMPORARY MERGE QUEUE REDUCTION: pull requests and main pushes retain
      # static checks; merge groups rerun only SDK compatibility coverage.
      - if: github.event_name != 'merge_group' && runner.os == 'Linux'
        run: |
          go fmt ./...
          git diff --exit-code
      - if: github.event_name != 'merge_group' && runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ inputs.sdk-home }}/go
          version: latest
          args: --timeout=5m
      - if: runner.os == 'Linux'
        run: go test ./...
        working-directory: ${{ inputs.sdk-home }}/go/samples
      - run: npm ci --ignore-scripts
        working-directory: ${{ inputs.sdk-home }}/test/harness
      - if: runner.os == 'Windows'
        run: pwsh.exe -Command "Write-Host 'PowerShell ready'"
      - name: Test out-of-process
        id: subprocess
        env:
          COPILOT_HMAC_KEY: ${{ secrets.COPILOT_DEVELOPER_CLI_INTEGRATION_HMAC_KEY }}
        run: /bin/bash test.sh
      - name: Test in-process smoke
        if: ${{ !cancelled() && (steps.subprocess.outcome == 'success' || steps.subprocess.outcome == 'failure') }}
        env:
          COPILOT_HMAC_KEY: ${{ secrets.COPILOT_DEVELOPER_CLI_INTEGRATION_HMAC_KEY }}
          COPILOT_SDK_DEFAULT_CONNECTION: inprocess
          GOFLAGS: -tags=copilot_inprocess
        run: |
          go test -v -race -timeout=20m ./internal/e2e -run '^TestInProcessFfiE2E$'
          go test -v -race -timeout=20m ./internal/e2e -run '^TestClientE2E$/^should_use_configured_github_host_for_authentication$'

  go-musl-x64:
    name: "Go (Alpine x64)"
    if: inputs.platform == 'all' || inputs.platform == 'linuxmusl-x64'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 4
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-sdk-runtime
        with:
          artifact-name: executable-sdk-Linux-X64-musl
          path: ${{ github.workspace }}
      - run: node "$SDK_HOME/scripts/ci/runtime-artifact.mjs" restore
        working-directory: .
      - uses: ./.github/actions/run-alpine-tests
        env:
          COPILOT_HMAC_KEY: ${{ secrets.COPILOT_DEVELOPER_CLI_INTEGRATION_HMAC_KEY }}
        with:
          image: golang:1.24-alpine
          sdk-root: /workspace/${{ inputs.sdk-home }}
          workdir: /workspace/${{ inputs.sdk-home }}
          command: |
            apk add --no-cache build-base nodejs npm
            npm --prefix "$COPILOT_SDK_ROOT/nodejs" ci --ignore-scripts
            npm --prefix "$COPILOT_SDK_ROOT/test/harness" ci --ignore-scripts

            export GITHUB_ENV=/tmp/copilot-sdk-runtime.env
            export COPILOT_RUNTIME_TARGET=linuxmusl-x64
            export COPILOT_RUNTIME_OUTPUT_DIRECTORY=/workspace/.sdk-runtime/linuxmusl-x64
            node "$COPILOT_SDK_ROOT/scripts/ci/runtime-artifact.mjs" prepare
            set -a
            . "$GITHUB_ENV"
            set +a
            case "$COPILOT_CLI_PATH" in
              */prebuilds/linuxmusl-x64/copilot-runtime) ;;
              *) echo "Expected the linuxmusl-x64 runtime, got: $COPILOT_CLI_PATH" >&2; exit 1 ;;
            esac

            export CGO_ENABLED=1
            test "$(go env GOARCH)" = "amd64"
            test "$(go env CGO_ENABLED)" = "1"
            cd "$COPILOT_SDK_ROOT/go"
            status=0
            /bin/bash test.sh || status=$?
            export COPILOT_SDK_DEFAULT_CONNECTION=inprocess
            export GOFLAGS="-tags=copilot_inprocess"
            go test -v -race -timeout=20m ./internal/e2e -run '^TestInProcessFfiE2E$' || status=$?
            go test -v -race -timeout=20m ./internal/e2e -run '^TestClientE2E$/^should_use_configured_github_host_for_authentication$' || status=$?
            exit "$status"

  docs-go:
    name: "Docs (Go)"
    if: inputs.platform == 'all' || inputs.platform == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: ${{ inputs.sdk-home }}/go/go.sum
      - run: npm ci
        working-directory: ${{ inputs.sdk-home }}/scripts/docs-validation
      - run: npm run extract && npm run validate:go
        working-directory: ${{ inputs.sdk-home }}/scripts/docs-validation
