name: "SDK runtime artifact"

env:
  COPILOT_AUTO_UPDATE: "false"
  COPILOT_BAZEL_ANG_ENABLED: ${{ vars.COPILOT_BAZEL_ANG_ENABLED }}
  COPILOT_BAZEL_ANG_SCOPE: ${{ vars.COPILOT_BAZEL_ANG_SCOPE }}
  COPILOT_BAZEL_ANG_PR_SAMPLE_PERCENTAGE: ${{ vars.COPILOT_BAZEL_ANG_PR_SAMPLE_PERCENTAGE }}
  COPILOT_BAZEL_ANG_PR_SAMPLED_MODE: ${{ vars.COPILOT_BAZEL_ANG_PR_SAMPLED_MODE }}
  COPILOT_RUNTIME_E2E_TEST_HOOKS: "1"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  GIT_HTTP_LOW_SPEED_LIMIT: 1000
  GIT_HTTP_LOW_SPEED_TIME: 60
  HUSKY: 0
  SETUP_NODE_TIMEOUT_MINUTES: 10

on:
  workflow_call:
    inputs:
      runtime-source:
        required: true
        type: string
      sdk-home:
        required: true
        type: string
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      artifact:
        required: true
        type: string
      bazel-config:
        required: false
        default: ""
        type: string
      use-bazel-addons-on-darwin:
        required: false
        default: false
        type: boolean
      shared-cli-build-compatible:
        required: false
        default: false
        type: boolean
      prebuilt-addons-artifact:
        required: false
        default: ""
        type: string
      timeout-minutes:
        required: false
        default: 90
        type: number

permissions:
  contents: read

concurrency:
  group: ${{ inputs.shared-cli-build-compatible && format('project-build-sea-{0}-release-{1}-{2}', inputs.os, inputs.bazel-config, github.sha) || format('sdk-runtime-artifact-{0}-{1}', inputs.target, github.sha) }}
  queue: max

jobs:
  cache-relay:
    if: inputs.runtime-source == 'checkout'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Capture verified addon source identity
        run: node --experimental-strip-types script/resolve-cli-build-identity.ts --github-env

      - name: Restore completed runtime build
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            project-build-receipt.txt
            dist-cli/
            dist-tmp/release-downloads/ripgrep/
            dist-tmp/release-downloads/tgrep/
            dist-bin/
            dist-pkg-tarballs/
            src/core/sharedApi/runtime-generated/index.d.ts
            src/native/runtime/runtime.*.node.metadata
            src/native/runtime/copilot-runtime.*.profile
            src/native/runtime/index.d.ts
            src/native/cli/index.d.ts
            !dist-cli/sea.blob
            !dist-cli/github-copilot-*.tgz
          key: ${{ inputs.shared-cli-build-compatible && format('project-build-v4-sea-{0}-{1}-release-{2}-{3}-{4}', inputs.os, inputs.target, inputs.bazel-config, inputs.use-bazel-addons-on-darwin, github.sha) || format('sdk-project-build-v4-{0}-{1}-{2}-release-{3}-{4}-{5}', inputs.target, inputs.os, inputs.target, inputs.bazel-config, inputs.use-bazel-addons-on-darwin, github.sha) }}
          enableCrossOsArchive: "true"

      - name: Restore cached source-layout addons and executable bits
        if: steps.cache.outputs.cache-hit == 'true'
        run: node script/restore-cli-build.mjs

      - name: Verify completed runtime build
        if: steps.cache.outputs.cache-hit == 'true'
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          extension=
          if [[ "$TARGET" == win32-* ]]; then
            extension=.exe
          fi
          test -s project-build-receipt.txt
          test -s "dist-cli/prebuilds/$TARGET/runtime.node"
          test -s "dist-cli/prebuilds/$TARGET/cli-native.node"
          test -s "dist-cli/prebuilds/$TARGET/copilot-runtime$extension"
          test -s "dist-bin/$TARGET/copilot$extension"

      - name: Upload SDK runtime artifact
        if: steps.cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: executable-sdk-${{ inputs.artifact }}
          path: |
            dist-cli/
            dist-bin/${{ inputs.target }}/
            !dist-cli/sea.blob
            !dist-cli/github-copilot-*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    needs: cache-relay
    if: >-
      !cancelled() &&
      (inputs.runtime-source == 'published' ||
       (needs.cache-relay.result == 'success' && needs.cache-relay.outputs.cache-hit != 'true'))
    runs-on: ${{ inputs.runtime-source == 'checkout' && inputs.os || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 4
        with:
          persist-credentials: false

      # Capture identity before caches, dependency setup, or downloaded addons
      # can make the checkout appear dirty to metadata verification.
      - uses: actions/setup-node@v6
        if: inputs.runtime-source == 'checkout'
        with:
          node-version-file: .nvmrc

      - name: Capture verified addon source identity
        if: inputs.runtime-source == 'checkout'
        run: node --experimental-strip-types script/resolve-cli-build-identity.ts --github-env

      # Restore/save paths must match shared-cli-build.yml in the same order:
      # Actions includes the path list in the cache version, independently of the key.
      - name: Restore completed runtime build
        id: cache
        if: inputs.runtime-source == 'checkout'
        uses: actions/cache/restore@v6
        with:
          path: |
            project-build-receipt.txt
            dist-cli/
            dist-tmp/release-downloads/ripgrep/
            dist-tmp/release-downloads/tgrep/
            dist-bin/
            dist-pkg-tarballs/
            src/core/sharedApi/runtime-generated/index.d.ts
            src/native/runtime/runtime.*.node.metadata
            src/native/runtime/copilot-runtime.*.profile
            src/native/runtime/index.d.ts
            src/native/cli/index.d.ts
            !dist-cli/sea.blob
            !dist-cli/github-copilot-*.tgz
          key: ${{ inputs.shared-cli-build-compatible && format('project-build-v4-sea-{0}-{1}-release-{2}-{3}-{4}', inputs.os, inputs.target, inputs.bazel-config, inputs.use-bazel-addons-on-darwin, github.sha) || format('sdk-project-build-v4-{0}-{1}-{2}-release-{3}-{4}-{5}', inputs.target, inputs.os, inputs.target, inputs.bazel-config, inputs.use-bazel-addons-on-darwin, github.sha) }}
          enableCrossOsArchive: "true"

      - name: Restore cached source-layout addons and executable bits
        if: inputs.runtime-source == 'checkout' && steps.cache.outputs.cache-hit == 'true'
        run: node script/restore-cli-build.mjs

      - if: inputs.runtime-source == 'checkout' && steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-node
        timeout-minutes: ${{ fromJSON(env.SETUP_NODE_TIMEOUT_MINUTES) }}

      - name: Capture verified addon source identity
        if: inputs.runtime-source == 'checkout' && steps.cache.outputs.cache-hit != 'true'
        run: node --experimental-strip-types script/resolve-cli-build-identity.ts --github-env

      - if: inputs.runtime-source == 'checkout' && steps.cache.outputs.cache-hit != 'true' && inputs.prebuilt-addons-artifact == '' && !(runner.os == 'Windows' && inputs.target == 'win32-arm64')
        uses: ./.github/actions/setup-bazel
        with:
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          datadog-site: ${{ vars.DATADOG_SITE || vars.DD_SITE }}

      - name: Set up private source authentication
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          inputs.runtime-source == 'checkout' &&
          steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-private-source-auth
        with:
          client-id: ${{ vars.RUNTIME_ACCESSOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.RUNTIME_ACCESSOR_APP_PRIVATE_KEY }}

      - name: Install the ARM64 strip tool
        if: inputs.runtime-source == 'checkout' && steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux' && endsWith(inputs.target, '-arm64')
        run: script/linux/apt-install.sh binutils-aarch64-linux-gnu

      - if: inputs.runtime-source == 'checkout' && steps.cache.outputs.cache-hit != 'true' && inputs.prebuilt-addons-artifact != ''
        uses: ./.github/actions/use-prebuilt-native-addons
        with:
          artifact-name: ${{ inputs.prebuilt-addons-artifact }}

      - if: inputs.runtime-source == 'checkout' && steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-sea-executable
        with:
          bazel-config: ${{ inputs.bazel-config }}
          os: sdk-${{ inputs.artifact }}
          target: ${{ inputs.target }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-bazel-addons-on-darwin: ${{ inputs.use-bazel-addons-on-darwin }}

      - if: inputs.runtime-source == 'published'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ inputs.sdk-home }}/nodejs/package-lock.json

      - if: inputs.runtime-source == 'published'
        run: npm ci --ignore-scripts
        working-directory: ${{ inputs.sdk-home }}/nodejs

      - name: Download pinned published runtime
        if: inputs.runtime-source == 'published'
        env:
          SDK_HOME: ${{ inputs.sdk-home }}
          TARGET: ${{ inputs.target }}
        run: npm --prefix "$SDK_HOME/nodejs" exec -- tsx "$SDK_HOME/scripts/ci/prepare-published-runtime.ts" "$TARGET"

      - name: Record completed runtime build
        if: inputs.runtime-source == 'checkout' && steps.cache.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ inputs.target }}
        run: printf 'variant=sea\nprofile=release\nsha=%s\ntarget=%s\n' "$GITHUB_SHA" "$TARGET" > project-build-receipt.txt

      - name: Save completed runtime build
        if: inputs.runtime-source == 'checkout' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            project-build-receipt.txt
            dist-cli/
            dist-tmp/release-downloads/ripgrep/
            dist-tmp/release-downloads/tgrep/
            dist-bin/
            dist-pkg-tarballs/
            src/core/sharedApi/runtime-generated/index.d.ts
            src/native/runtime/runtime.*.node.metadata
            src/native/runtime/copilot-runtime.*.profile
            src/native/runtime/index.d.ts
            src/native/cli/index.d.ts
            !dist-cli/sea.blob
            !dist-cli/github-copilot-*.tgz
          key: ${{ steps.cache.outputs.cache-primary-key }}
          enableCrossOsArchive: "true"

      - name: Upload SDK runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: executable-sdk-${{ inputs.artifact }}
          path: |
            dist-cli/
            dist-bin/${{ inputs.target }}/
            !dist-cli/sea.blob
            !dist-cli/github-copilot-*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
