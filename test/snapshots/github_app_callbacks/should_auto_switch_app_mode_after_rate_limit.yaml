models:
  - claude-sonnet-5
  - auto
errors:
  - model: claude-sonnet-5
    status: 429
    code: user_weekly_rate_limited
    message: You've reached your weekly rate limit.
    retryAfterSeconds: 1
    messages:
      - role: system
        content: ${system}
      - role: user
        content: Explain that the GitHub app recovered from a rate limit in one short sentence.
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Explain that the GitHub app recovered from a rate limit in one short sentence.
      - role: assistant
        content: The GitHub app recovered from the rate limit and continued automatically.
