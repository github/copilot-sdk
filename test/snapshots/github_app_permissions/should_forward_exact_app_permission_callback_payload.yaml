models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Call app_permission_tool with key 'payload', then reply with exactly its result.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: app_permission_tool
              arguments: '{"key":"payload"}'
      - role: tool
        tool_call_id: toolcall_0
        content: APP_PERMISSION_PAYLOAD
      - role: assistant
        content: APP_PERMISSION_PAYLOAD
