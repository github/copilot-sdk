models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Call app_lookup_issue for owner octo and issue number 42. Reply with its result.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: app_lookup_issue
              arguments: '{"owner":"octo","number":42}'
      - role: tool
        tool_call_id: toolcall_0
        content: APP_ISSUE_octo_42
      - role: assistant
        content: APP_ISSUE_octo_42
