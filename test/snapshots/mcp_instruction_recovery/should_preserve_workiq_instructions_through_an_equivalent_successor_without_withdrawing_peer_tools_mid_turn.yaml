models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Call read_record on workiq. If it reports a changed tool catalog, retry it. then call read_record on healthy.
          Do not use other tools or invent their outputs. Finish by reporting both record values and
          CATALOG_RECOVERY_COMPLETE.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: workiq-read_record
              arguments: "{}"
      - role: tool
        tool_call_id: toolcall_0
        content: CATALOG_RECORD
      - role: assistant
        tool_calls:
          - id: toolcall_1
            type: function
            function:
              name: healthy-read_record
              arguments: "{}"
      - role: tool
        tool_call_id: toolcall_1
        content: PEER_RECORD
      - role: assistant
        content: |-
          workiq record: CATALOG_RECORD
          healthy record: PEER_RECORD

          CATALOG_RECOVERY_COMPLETE
