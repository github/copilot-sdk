models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: "The plan is one step: create a file named fleet-alpha.txt in the current directory containing exactly the text
          alpha. Do not write a plan file, create todos, or call any other tool first. Request approval right away with
          exit_plan_mode, setting recommendedAction to autopilot_fleet."
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: exit_plan_mode
              arguments: '{"summary":"Create fleet-alpha.txt in current directory containing exactly the text
                \"alpha\".","recommendedAction":"autopilot_fleet","showFleet":true}'
      - role: tool
        tool_call_id: toolcall_0
        content: >-
          Plan approved! Exited plan mode.


          You are now in autopilot mode with fleet enabled. Proceed with implementing the plan in fleet mode by
          following the fleet-mode instructions below.


          <fleet_mode_instructions>

          You are now in fleet mode. Dispatch sub-agents (via the task tool) in parallel to do the work.


          **Getting Started**

          1. Check for existing todos: `SELECT id, title, status FROM todos WHERE status != 'done'`

          2. If todos exist, dispatch them in parallel (respecting dependencies)

          3. If no todos exist, help decompose the work into todos first. Try to structure todos to minimize
          dependencies and maximize parallel execution.


          **Parallel Execution**

          - Dispatch independent todos simultaneously

          - Never dispatch just a single background subagent. Prefer one sync subagent, or better, prefer to efficiently
          dispatch multiple background subagents in the same turn.

          - Only serialize todos with true dependencies (check todo_deps)

          - Query ready todos: `SELECT * FROM todos WHERE status = 'pending' AND id NOT IN (SELECT todo_id FROM
          todo_deps td JOIN todos t ON td.depends_on = t.id WHERE t.status != 'done')`


          **Sub-Agent Instructions**

          When dispatching a sub-agent, include these instructions in your prompt:

          1. Update the todo status when finished:
             - Success: `UPDATE todos SET status = 'done' WHERE id = '<todo-id>'`
             - Blocked: `UPDATE todos SET status = 'blocked' WHERE id = '<todo-id>'`
          2. Always return a response summarizing:
             - What was completed
             - Whether the todo is fully done or needs more work
             - Any blockers or questions that need resolution

          **Coordination**

          - After sub-agents return, check todo status in SQL (source of truth)

          - If status is still 'in_progress', the sub-agent may have failed to update - investigate

          - Use the sub-agent's response to understand context, but trust SQL for status


          **After Sub-Agents Complete**

          - Check the work done by sub-agents and validate the original request is fully satisfied

          - Ensure the work done by sub-agents (both implementation and testing) is sensible, robust, and handles edge
          cases, not just the happy path

          - If the original request is not fully satisfied, decompose remaining work into new todos and dispatch more
          sub-agents as needed


          Now proceed with the user's request using fleet mode.

          </fleet_mode_instructions>
      - role: assistant
        tool_calls:
          - id: toolcall_1
            type: function
            function:
              name: create
              arguments: '{"path":"${workdir}/fleet-alpha.txt","file_text":"alpha"}'
      - role: tool
        tool_call_id: toolcall_1
        content: Created file ${workdir}/fleet-alpha.txt with 5 characters
      - role: assistant
        content: Created `fleet-alpha.txt` with exact content "alpha" (5 characters, no extra whitespace).
      - role: user
        content: >-
          You have not yet marked the task as complete using the task_complete tool. If you were planning, stop planning
          and start implementing. You aren't done until you have fully completed the task.


          IMPORTANT: Do NOT call task_complete if:

          - You have open questions or ambiguities - make good decisions and keep working

          - You encountered an error - try to resolve it or find an alternative approach

          - There are remaining steps - complete them first


          Keep working autonomously until the task is truly finished, then call task_complete.
      - role: assistant
        tool_calls:
          - id: toolcall_2
            type: function
            function:
              name: task_complete
              arguments: '{"summary":"Created fleet-alpha.txt in the current directory with exact content \"alpha\" (verified 5
                characters written)."}'
