models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Call wait_for_app_release, then reply with its result.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: wait_for_app_release
              arguments: "{}"
      - role: tool
        tool_call_id: toolcall_0
        content: ACTIVE_TURN_RELEASED
      - role: user
        content: Reply with STEERING_APP_MESSAGE instead.
      - role: assistant
        content: STEERING_APP_MESSAGE
      - role: user
        content: Reply with QUEUED_APP_MESSAGE after the active turn.
      - role: assistant
        content: QUEUED_APP_MESSAGE
