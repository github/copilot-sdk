models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Call app_blocking_lookup with key 'abort', then reply with the result.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: app_blocking_lookup
              arguments: '{"key":"abort"}'
      - role: tool
        tool_call_id: toolcall_0
        content: The execution of this tool, or a previous tool was interrupted.
      - role: user
        content: Reply with exactly APP_ABORT_RECOVERY_OK.
      - role: assistant
        content: APP_ABORT_RECOVERY_OK
