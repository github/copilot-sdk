        content: Reply with exactly HISTORY_APP_DISCARDED.
      - role: assistant
        content: HISTORY_APP_DISCARDED
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Reply with exactly HISTORY_APP_FIRST.
      - role: assistant
        content: HISTORY_APP_FIRST
