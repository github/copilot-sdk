models:
  - claude-sonnet-4.5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Use the create tool to create rewind-sdk.txt containing exactly SDK rewind content. After the tool succeeds,
          reply with exactly SDK_REWIND_DONE.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: create
              arguments: '{"path":"${workdir}/rewind-sdk.txt","file_text":"SDK rewind content"}'
      - role: tool
        tool_call_id: toolcall_0
        content: Created file ${workdir}/rewind-sdk.txt with 18 characters
      - role: assistant
        content: SDK_REWIND_DONE
