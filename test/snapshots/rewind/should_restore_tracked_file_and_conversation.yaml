models:
  - claude-sonnet-4.5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: "Reply with exactly: SDK_REWIND_READY"
      - role: assistant
        content: SDK_REWIND_READY
      - role: user
        content: Use the edit tool to replace the exact contents of rewind-sdk.txt from Original rewind content to SDK rewind
          content. After the tool succeeds, reply with exactly SDK_REWIND_DONE.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: edit
              arguments: '{"path":"${workdir}/rewind-sdk.txt","old_str":"Original rewind content","new_str":"SDK rewind content"}'
      - role: tool
        tool_call_id: toolcall_0
        content: File ${workdir}/rewind-sdk.txt updated with changes.
      - role: assistant
        content: SDK_REWIND_DONE
