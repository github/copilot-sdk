models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Create a scenario client plan, then request approval with exit_plan_mode.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: exit_plan_mode
              arguments: '{"summary":"scenario client implementation
                plan","actions":["autopilot","interactive","exit_only"],"recommendedAction":"interactive"}'
      - role: tool
        tool_call_id: toolcall_0
        content: >-
          Plan approved! Exited plan mode.


          You are now in interactive mode. Start implementing the plan now, in this same response. Approving the plan is
          your go-signal, so do not stop to ask whether to proceed or wait for another message.
      - role: assistant
        content: The scenario client plan was approved.
