models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Call scenario_event_lookup with key 'ordered', then reply with exactly its result.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: scenario_event_lookup
              arguments: '{"key":"ordered"}'
      - role: tool
        tool_call_id: toolcall_0
        content: SCENARIO_EVENT_ORDERED
      - role: assistant
        content: SCENARIO_EVENT_ORDERED
