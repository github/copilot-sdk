models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Call scenario_get_deployment for environment production. Reply with its result.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: scenario_get_deployment
              arguments: '{"environment":"production"}'
      - role: tool
        tool_call_id: toolcall_0
        content: SCENARIO_DEPLOYMENT_READY:production
      - role: assistant
        content: SCENARIO_DEPLOYMENT_READY:production
