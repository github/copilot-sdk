models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Call scenario_search_pull_requests with query is:open label:bug. Reply with its result.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: scenario_search_pull_requests
              arguments: '{"query":"is:open label:bug"}'
      - role: tool
        tool_call_id: toolcall_0
        content: SCENARIO_SEARCH_TEXT:is:open label:bug
      - role: assistant
        content: SCENARIO_SEARCH_TEXT:is:open label:bug
