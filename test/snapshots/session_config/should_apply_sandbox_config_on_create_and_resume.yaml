models:
  - claude-sonnet-4.5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Check sandbox access for sandbox-create-enabled.txt.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: ${shell}
              arguments: '{"command":"(printf probe > \"$HOME/sandbox-create-enabled.txt\") 2>/dev/null && echo sandbox-accessible || echo sandbox-blocked","description":"Check enabled sandbox policy"}'
