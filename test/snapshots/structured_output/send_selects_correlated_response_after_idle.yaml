models:
  - gpt-4.1
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Call read_inventory once, then report the current widget count and color.
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: read_inventory
              arguments: "{}"
      - role: tool
        tool_call_id: toolcall_0
        content: The inventory contains 42 red widgets.
      - role: assistant
        content: '{"color":"red","count":42}'
